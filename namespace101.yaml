name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # INSTALL + LOGIN
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

      # =========================
      # FETCH AKS CLUSTERS
      # =========================
      - name: Fetch AKS clusters
        run: |
          az aks list --query "[].name" -o tsv | sort > aks_clusters.txt
          echo "Total AKS clusters found: $(wc -l < aks_clusters.txt)"

      # =========================
      # COLLECT HELMFILE DATA
      # =========================
      - name: Collect Helmfile Data
        run: |
          echo "Collecting helmfile applications..."
          > helmfile_data.txt
          
          EXCLUDED="trident|tailscale|velero|mtls-outbound|default|datadog"
          
          find apps -type f -name "helmfile.yaml" | while read file; do
            rel=${file#apps/}
            IFS='/' read -ra p <<< "$rel"
            app=${p[0]}
            
            echo "$app" | grep -qiE "^($EXCLUDED)$" && continue
            
            cluster=$(grep -iE "kubeContext:|context:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")
            
            [[ -z "$cluster" ]] && continue
            echo "$cluster" | grep -q "UPDATE_ME" && continue
            grep -qx "$cluster" aks_clusters.txt || continue
            
            namespace=$(grep -E "^[[:space:]]*namespace:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs)
            
            [[ -z "$namespace" || "$namespace" == *"{{"* ]] && namespace="$app"
            
            echo "$cluster|$namespace|$app" >> helmfile_data.txt
          done
          
          sort -u helmfile_data.txt -o helmfile_data.txt
          echo "Total helmfile apps: $(wc -l < helmfile_data.txt)"

      # =========================
      # COLLECT AKS DATA
      # =========================
      - name: Collect AKS Data
        run: |
          echo "Collecting AKS deployments..."
          export KUBECONFIG=/tmp/kubeconfig
          > aks_data.txt
          
          EXCLUDED_APPS="trident|tailscale|velero|mtls-outbound|datadog|ingress|cert-manager|konnectivity|azure-cni|calico|gatekeeper|tigera"
          
          while read cluster; do
            rg=$(az aks list --query "[?name=='$cluster'].resourceGroup" -o tsv)
            
            if [ -z "$rg" ]; then
              continue
            fi
            
            az aks get-credentials -g "$rg" -n "$cluster" --overwrite-existing >/dev/null 2>&1
            
            if ! kubectl get ns >/dev/null 2>&1; then
              continue
            fi
            
            kubectl get deployments --all-namespaces --no-headers 2>/dev/null | \
              while read ns name rest; do
                echo "$name" | grep -qiE "^($EXCLUDED_APPS)$" && continue
                echo "$cluster|$ns|$name" >> aks_data.txt
              done
            
          done < aks_clusters.txt
          
          sort -u aks_data.txt -o aks_data.txt
          echo "Total AKS deployments: $(wc -l < aks_data.txt)"

      # =========================
      # DISPLAY HELMFILE DATA
      # =========================
      - name: Display Helmfile Data
        run: |
          echo ""
          echo "================ HELMFILE DATA ================="
          printf "%-35s %-25s %-25s\n" "Cluster Name" "Namespace" "Application"
          printf "%-35s %-25s %-25s\n" "============" "=========" "==========="
          
          while IFS='|' read cluster ns app; do
            printf "%-35s %-25s %-25s\n" "$cluster" "$ns" "$app"
          done < helmfile_data.txt

      # =========================
      # DISPLAY AKS DATA
      # =========================
      - name: Display AKS Data
        run: |
          echo ""
          echo "================ AKS DATA ================="
          printf "%-35s %-25s %-25s\n" "Cluster Name" "Namespace" "Application"
          printf "%-35s %-25s %-25s\n" "============" "=========" "==========="
          
          if [ -s aks_data.txt ]; then
            while IFS='|' read cluster ns app; do
              printf "%-35s %-25s %-25s\n" "$cluster" "$ns" "$app"
            done < aks_data.txt
          else
            echo "No AKS deployments found"
          fi

      # =========================
      # COMPARE AND GENERATE FINAL TABLE
      # =========================
      - name: Compare and Generate Final Table
        run: |
          echo ""
          echo "================ COMPARISON RESULTS ================="
          echo ""
          
          printf "%-35s %-25s %-35s %-10s\n" \
          "Cluster Name" "Namespace" "Application" "Deployed"
          printf "%-35s %-25s %-35s %-10s\n" \
          "============" "==========" "===================" "========"
          
          if [ ! -s aks_data.txt ]; then
            echo "WARNING: No AKS data available - all apps showing as NOT DEPLOYED"
            echo ""
          fi
          
          total=0
          deployed=0
          
          while IFS='|' read helm_cluster helm_ns helm_app; do
            total=$((total + 1))
            matched="NO"
            
            # Create normalized versions for matching
            helm_cluster_lower=$(echo "$helm_cluster" | tr '[:upper:]' '[:lower:]')
            helm_ns_lower=$(echo "$helm_ns" | tr '[:upper:]' '[:lower:]')
            helm_app_lower=$(echo "$helm_app" | tr '[:upper:]' '[:lower:]')
            
            # Try multiple matching strategies
            if grep -q "^$helm_cluster|$helm_ns|$helm_app$" aks_data.txt 2>/dev/null; then
              matched="YES"
              deployed=$((deployed + 1))
            elif grep -qi "^$helm_cluster|$helm_ns|$helm_app$" aks_data.txt 2>/dev/null; then
              matched="YES"
              deployed=$((deployed + 1))
            elif grep -q "^$helm_cluster|.*|$helm_app$" aks_data.txt 2>/dev/null; then
              matched="YES"
              deployed=$((deployed + 1))
            elif grep -qi "^$helm_cluster_lower|.*|$helm_app_lower$" aks_data.txt 2>/dev/null; then
              matched="YES"
              deployed=$((deployed + 1))
            fi
            
            printf "%-35s %-25s %-35s %-10s\n" "$helm_cluster" "$helm_ns" "$helm_app" "$matched"
            
          done < helmfile_data.txt
          
          echo ""
          echo "=============================================================="
          echo ""
          echo "STATISTICS:"
          echo "  Total helmfile applications: $total"
          echo "  Deployed in AKS: $deployed"
          echo "  Not deployed: $((total - deployed))"
          
          if [ $total -gt 0 ]; then
            percentage=$(echo "scale=2; $deployed * 100 / $total" | bc)
            echo "  Coverage: ${percentage}%"
          fi
          echo ""

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-reports
          path: |
            aks_clusters.txt
            helmfile_data.txt
            aks_data.txt
          retention-days: 7
