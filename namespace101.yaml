name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # INSTALL + LOGIN
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

      # =========================
      # FETCH AKS CLUSTERS
      # =========================
      - name: Fetch AKS clusters
        run: |
          az aks list --query "[].name" -o tsv > aks_clusters.txt

      # =========================
      # HELMFILE OUTPUT
      # =========================
      - name: Print Helmfile Data
        run: |
          echo ""
          echo "================ HELMFILE DATA ================="

          printf "%-35s %-25s %-25s\n" \
          "Cluster Name" "Namespace" "Application"

          printf "%-35s %-25s %-25s\n" \
          "============" "=========" "==========="

          EXCLUDED="trident|tailscale|velero|mtls-outbound|default"

          find apps -type f -name "helmfile.yaml" | while read file; do

            rel=${file#apps/}
            IFS='/' read -ra p <<< "$rel"

            app=${p[0]}

            echo "$app" | grep -qiE "^($EXCLUDED)$" && continue

            cluster=$(grep -iE "kubeContext:|context:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")

            [[ -z "$cluster" ]] && continue
            echo "$cluster" | grep -q "UPDATE_ME" && continue

            grep -qx "$cluster" aks_clusters.txt || continue

            namespace=$(grep -E "^[[:space:]]*namespace:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs)

            [[ -z "$namespace" || "$namespace" == *"{{"* ]] && namespace="$app"

            printf "%-35s %-25s %-25s\n" "$cluster" "$namespace" "$app"

          done

      # =========================
      # AKS OUTPUT
      # =========================
      - name: Print AKS Data
        run: |
          echo ""
          echo "================ AKS DATA ================="

          printf "%-35s %-25s %-25s\n" \
          "Cluster Name" "Namespace" "Deployed App"

          printf "%-35s %-25s %-25s\n" \
          "============" "=========" "============="

          EXCLUDED="trident|tailscale|velero|mtls-outbound|default"

          export KUBECONFIG=/tmp/kubeconfig

          while read cluster; do

            echo "Processing $cluster"

            rg=$(az aks list --query "[?name=='$cluster'].resourceGroup" -o tsv)

            az aks get-credentials -g "$rg" -n "$cluster" --overwrite-existing >/dev/null 2>&1

            kubectl get ns >/dev/null 2>&1 || continue

            kubectl get ns --no-headers | awk '{print $1}' \
            | grep -vE "^(default|kube-|calico|tigera|gatekeeper|trident|aks-command)" \
            | while read ns; do

              kubectl get deploy -n "$ns" --no-headers 2>/dev/null \
              | awk '{print $1}' \
              | grep -viE "^($EXCLUDED)$" \
              | while read d; do
                  printf "%-35s %-25s %-25s\n" "$cluster" "$ns" "$d"
                done

            done

          done < aks_clusters.txt

      # =========================
      # SUMMARY OUTPUT
      # =========================
      - name: Print Summary
        run: |
          echo ""
          echo "=============================================================="
          echo "CLUSTER DEPLOYMENTS (HELMFILE + AKS)"
          echo "=============================================================="
          echo ""

          echo "========================= SUMMARY ============================"

          export KUBECONFIG=/tmp/kubeconfig

          # HELMFILE COUNTS
          > helm_clusters.txt
          > helm_namespaces.txt

          find apps -type f -name "helmfile.yaml" | while read file; do

            cluster=$(grep -iE "kubeContext:|context:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")

            [[ -z "$cluster" ]] && continue
            echo "$cluster" | grep -q "UPDATE_ME" && continue

            namespace=$(grep -E "^[[:space:]]*namespace:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs)

            [[ -z "$namespace" || "$namespace" == *"{{"* ]] && namespace="UNKNOWN"

            echo "$cluster" >> helm_clusters.txt
            echo "$cluster:$namespace" >> helm_namespaces.txt

          done

          HELM_CLUSTER_COUNT=$(sort -u helm_clusters.txt | wc -l)
          HELM_NS_COUNT=$(sort -u helm_namespaces.txt | wc -l)

          # AKS COUNTS
          AKS_CLUSTER_COUNT=$(wc -l < aks_clusters.txt)

          UNREACHABLE=0
          > aks_namespaces.txt

          while read cluster; do

            rg=$(az aks list --query "[?name=='$cluster'].resourceGroup" -o tsv)

            az aks get-credentials -g "$rg" -n "$cluster" --overwrite-existing >/dev/null 2>&1

            if ! kubectl get ns >/dev/null 2>&1; then
              UNREACHABLE=$((UNREACHABLE+1))
              continue
            fi

            kubectl get ns --no-headers | awk '{print $1}' \
            | while read ns; do
                echo "$cluster:$ns" >> aks_namespaces.txt
              done

          done < aks_clusters.txt

          AKS_NS_COUNT=$(sort -u aks_namespaces.txt | wc -l)

          echo ""
          echo "Total Helmfile Clusters : $HELM_CLUSTER_COUNT"
          echo "Total Helmfile Namespace: $HELM_NS_COUNT"
          echo "Total AKS Clusters      : $AKS_CLUSTER_COUNT"
          echo "Total AKS Namespace     : $AKS_NS_COUNT"
          echo "Unreachable Clusters    : $UNREACHABLE"

          echo "=============================================================="

      # =========================
      # FINAL TABLE (HELMFILE vs AKS) - IMPROVED COMPARISON
      # =========================
      - name: Final Confluence Table
        run: |
          echo ""
          echo "================ CLUSTER DETAILS ================="

          printf "%-35s %-25s %-35s %-10s\n" \
          "Cluster Name" "Namespace" "Application" "Deployed Y/N"

          printf "%-35s %-25s %-35s %-10s\n" \
          "============" "==========" "===================" "=============="

          EXCLUDED="trident|tailscale|velero|mtls-outbound|default"

          export KUBECONFIG=/tmp/kubeconfig

          # Build AKS lookup cache with normalized names
          > aks_lookup.txt
          > aks_lookup_normalized.txt

          while read cluster; do
            rg=$(az aks list --query "[?name=='$cluster'].resourceGroup" -o tsv)
            
            if [ -z "$rg" ]; then
              continue
            fi
            
            az aks get-credentials -g "$rg" -n "$cluster" --overwrite-existing >/dev/null 2>&1

            if kubectl get ns >/dev/null 2>&1; then
              kubectl get ns --no-headers | awk '{print $1}' \
              | grep -vE "^(default|kube-|calico|tigera|gatekeeper|trident|aks-command)" \
              | while read ns; do
                kubectl get deploy -n "$ns" --no-headers 2>/dev/null \
                | awk '{print $1}' \
                | grep -viE "^($EXCLUDED)$" \
                | while read d; do
                    # Store original
                    echo "$cluster|$ns|$d" >> aks_lookup.txt
                    # Store normalized (lowercase, remove special chars)
                    cluster_norm=$(echo "$cluster" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
                    ns_norm=$(echo "$ns" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
                    app_norm=$(echo "$d" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
                    echo "$cluster_norm|$ns_norm|$app_norm" >> aks_lookup_normalized.txt
                  done
              done
            fi
          done < aks_clusters.txt

          # Process helmfile and compare with AKS
          > final_results.txt

          find apps -type f -name "helmfile.yaml" | while read file; do
            rel=${file#apps/}
            IFS='/' read -ra p <<< "$rel"
            app=${p[0]}

            echo "$app" | grep -qiE "^($EXCLUDED)$" && continue

            cluster=$(grep -iE "kubeContext:|context:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")

            [[ -z "$cluster" ]] && continue
            echo "$cluster" | grep -q "UPDATE_ME" && continue
            grep -qx "$cluster" aks_clusters.txt || continue

            namespace=$(grep -E "^[[:space:]]*namespace:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs)

            [[ -z "$namespace" || "$namespace" == *"{{"* ]] && namespace="$app"

            # MULTIPLE COMPARISON STRATEGIES
            matched="N"
            
            # Strategy 1: Exact match
            if grep -q "^$cluster|$namespace|$app$" aks_lookup.txt 2>/dev/null; then
              matched="Y"
            fi
            
            # Strategy 2: Case-insensitive match
            if [ "$matched" = "N" ]; then
              cluster_lower=$(echo "$cluster" | tr '[:upper:]' '[:lower:]')
              ns_lower=$(echo "$namespace" | tr '[:upper:]' '[:lower:]')
              app_lower=$(echo "$app" | tr '[:upper:]' '[:lower:]')
              
              if grep -qi "^$cluster_lower|$ns_lower|$app_lower$" aks_lookup.txt 2>/dev/null; then
                matched="Y"
              fi
            fi
            
            # Strategy 3: Normalized match (remove special chars)
            if [ "$matched" = "N" ]; then
              cluster_norm=$(echo "$cluster" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
              ns_norm=$(echo "$namespace" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
              app_norm=$(echo "$app" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
              
              if grep -q "^$cluster_norm|$ns_norm|$app_norm$" aks_lookup_normalized.txt 2>/dev/null; then
                matched="Y"
              fi
            fi
            
            # Strategy 4: Partial match (app name contains or is contained)
            if [ "$matched" = "N" ]; then
              if grep -q "^$cluster|$namespace|" aks_lookup.txt 2>/dev/null; then
                while IFS='|' read -r aks_cluster aks_ns aks_app; do
                  aks_app_lower=$(echo "$aks_app" | tr '[:upper:]' '[:lower:]')
                  app_lower=$(echo "$app" | tr '[:upper:]' '[:lower:]')
                  
                  if [[ "$aks_app_lower" == *"$app_lower"* ]] || [[ "$app_lower" == *"$aks_app_lower"* ]]; then
                    matched="Y"
                    break
                  fi
                done < <(grep "^$cluster|$namespace|" aks_lookup.txt)
              fi
            fi
            
            # Strategy 5: Check if app exists in any namespace in the cluster
            if [ "$matched" = "N" ]; then
              if grep -q "^$cluster|.*|$app$" aks_lookup.txt 2>/dev/null; then
                matched="Y"
              fi
            fi
            
            # Store result
            echo "$cluster|$namespace|$app|$matched" >> final_results.txt
            
          done

          # Display sorted results
          echo ""
          
          if [ -f final_results.txt ] && [ -s final_results.txt ]; then
            sort -t'|' -k1,1 -k2,2 final_results.txt | while IFS='|' read cluster ns app status; do
              if [ "$status" = "Y" ]; then
                printf "%-35s %-25s %-35s %-10s\n" "$cluster" "$ns" "$app" "YES"
              else
                printf "%-35s %-25s %-35s %-10s\n" "$cluster" "$ns" "$app" "NO"
              fi
            done
          else
            echo "No helmfile applications found to compare"
          fi

          echo ""
          echo "=============================================================="
          
          # Show statistics
          echo ""
          echo "COMPARISON STATISTICS:"
          total=$(grep -c "|" final_results.txt 2>/dev/null || echo "0")
          deployed=$(grep -c "|Y$" final_results.txt 2>/dev/null || echo "0")
          not_deployed=$(grep -c "|N$" final_results.txt 2>/dev/null || echo "0")
          
          echo "  Total helmfile apps: $total"
          echo "  Deployed in AKS: $deployed"
          echo "  Not deployed: $not_deployed"
          
          if [ "$total" -gt 0 ]; then
            percentage=$(echo "scale=2; $deployed * 100 / $total" | bc)
            echo "  Coverage: ${percentage}%"
          fi
          echo ""

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-reports
          path: |
            aks_clusters.txt
            aks_lookup.txt
            final_results.txt
          retention-days: 7
