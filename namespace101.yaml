name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # STEP 1: GET ALL APPS FROM /apps DIR AND CHECK HELMFILE
      # =========================
      - name: Get Helmfile Applications
        run: |
          echo "=============================================="
          echo "STEP 1: HELMFILE APPLICATIONS"
          echo "=============================================="
          echo ""
          
          # Create helmfile CSV
          echo "Cluster,Application,Namespace" > helmfile.csv
          
          # Excluded applications
          EXCLUDED_APPS="mtls-outbound|tailscale|velero|bin|examples"
          
          if [ ! -d "apps" ]; then
            echo "❌ ERROR: 'apps' directory not found!"
            exit 1
          fi
          
          find apps -type f \( -name "helmfile.yaml" -o -name "helmfile.yml" \) 2>/dev/null | while read file; do
            rel_path=${file#apps/}
            IFS='/' read -ra parts <<< "$rel_path"
            
            app_name=${parts[0]}
            
            # Skip excluded apps
            if echo "$app_name" | grep -qE "^($EXCLUDED_APPS)$"; then
              continue
            fi
            
            # Get cluster from path
            if [ ${#parts[@]} -ge 2 ]; then
              cluster_name=${parts[1]}
            else
              cluster_name="unknown"
            fi
            
            # Extract namespace
            namespace=""
            if [ -f "$file" ]; then
              namespace=$(grep -E "^[[:space:]]*namespace:" "$file" | head -1 | sed 's/.*namespace:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
              
              if [[ -z "$namespace" ]] || [[ "$namespace" == *"{{"* ]]; then
                values_file=$(dirname "$file")/values.yaml
                if [ -f "$values_file" ]; then
                  namespace=$(grep -E "^[[:space:]]*namespace:" "$values_file" | head -1 | sed 's/.*namespace:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
                fi
              fi
              
              if [[ -z "$namespace" ]] || [[ "$namespace" == *"{{"* ]]; then
                namespace="$app_name"
              fi
            fi
            
            # Check for cluster override
            raw_cluster=$(grep -iE "kubeContext:|context:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")
            
            if [[ -n "$raw_cluster" && "$raw_cluster" != *"{{"* ]]; then
              final_cluster="$raw_cluster"
            else
              final_cluster="$cluster_name"
            fi
            
            echo "$final_cluster,$app_name,$namespace" >> helmfile.csv
          done
          
          # Remove duplicates
          sort -u helmfile.csv -o helmfile.csv
          
          HELMFILE_APPS=$(tail -n +2 helmfile.csv 2>/dev/null | wc -l)
          HELMFILE_CLUSTERS=$(tail -n +2 helmfile.csv 2>/dev/null | cut -d',' -f1 | sort -u | wc -l)
          
          echo "Helmfile Applications Found: $HELMFILE_APPS"
          echo "Helmfile Clusters: $HELMFILE_CLUSTERS"
          echo ""
          
          echo "HELMFILE_APPS=$HELMFILE_APPS" >> $GITHUB_ENV
          echo "HELMFILE_CLUSTERS=$HELMFILE_CLUSTERS" >> $GITHUB_ENV

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # =========================
      # AZURE LOGIN
      # =========================
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # =========================
      # STEP 2: GET ALL AKS CLUSTERS WITH NAMESPACES
      # =========================
      - name: Get AKS Clusters and Namespaces
        run: |
          echo ""
          echo "=============================================="
          echo "STEP 2: AKS CLUSTERS AND NAMESPACES"
          echo "=============================================="
          echo ""
          
          export KUBECONFIG=/tmp/kubeconfig
          
          echo "Cluster,Namespace" > aks.csv
          
          # System namespaces to exclude
          SYSTEM_NS="^(default|kube-system|kube-public|kube-node-lease|calico-system|gatekeeper-system|tigera-operator|trident|aks-command|azure-)"
          
          # Get all AKS clusters
          az aks list --query "[].{name:name,rg:resourceGroup}" -o tsv | while read cluster rg; do
            echo "Processing cluster: $cluster"
            
            if az aks get-credentials --resource-group "$rg" --name "$cluster" --overwrite-existing >/dev/null 2>&1; then
              kubectl get ns --no-headers 2>/dev/null | awk '{print $1}' | grep -vE "$SYSTEM_NS" | while read ns; do
                if [ -n "$ns" ]; then
                  echo "$cluster,$ns" >> aks.csv
                fi
              done
            fi
          done
          
          AKS_CLUSTERS=$(tail -n +2 aks.csv 2>/dev/null | cut -d',' -f1 | sort -u | wc -l)
          AKS_NS=$(tail -n +2 aks.csv 2>/dev/null | wc -l)
          
          echo ""
          echo "AKS Clusters Found: $AKS_CLUSTERS"
          echo "AKS Namespaces Found: $AKS_NS"
          echo ""
          
          echo "AKS_CLUSTERS=$AKS_CLUSTERS" >> $GITHUB_ENV
          echo "AKS_NS=$AKS_NS" >> $GITHUB_ENV

      # =========================
      # STEP 3: COMPARE AND GENERATE FINAL TABLE
      # =========================
      - name: Generate Final Comparison Table
        run: |
          echo ""
          echo "=============================================="
          echo "FINAL OUTPUT: CLUSTER DEPLOYMENT STATUS"
          echo "=============================================="
          echo ""
          
          # Create AKS lookup
          declare -A aks_lookup
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ] && [ -n "$ns" ]; then
              key="${cluster}|${ns}"
              aks_lookup["$key"]=1
            fi
          done < aks.csv
          
          # Print header exactly as requested
          printf "| %-45s | %-35s | %-30s | %-12s |\n" "Cluster Name" "Namespaces" "Application Type" "Deployed Y/N?"
          printf "| %-45s | %-35s | %-30s | %-12s |\n" "$(printf '%0.s-' {1..45})" "$(printf '%0.s-' {1..35})" "$(printf '%0.s-' {1..30})" "$(printf '%0.s-' {1..12})"
          
          # Track deployed and not deployed counts
          deployed=0
          not_deployed=0
          
          # Process and sort by cluster
          tail -n +2 helmfile.csv | sort -t',' -k1,1 -k3,3 | while IFS=',' read -r cluster app namespace; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            if [ -z "$cluster" ] || [ -z "$app" ] || [ -z "$namespace" ]; then
              continue
            fi
            
            # Check if deployed
            key="${cluster}|${namespace}"
            if [[ -n "${aks_lookup[$key]}" ]]; then
              status="Y"
              deployed=$((deployed + 1))
            else
              status="N"
              not_deployed=$((not_deployed + 1))
            fi
            
            # Print in table format
            printf "| %-45s | %-35s | %-30s | %-12s |\n" "$cluster" "$namespace" "$app" "$status"
          done
          
          echo ""
          echo "DEPLOYED_COUNT=$deployed" >> $GITHUB_ENV
          echo "NOT_DEPLOYED_COUNT=$not_deployed" >> $GITHUB_ENV

      # =========================
      # STEP 4: PRINT SUMMARY WITH COUNTS AT TOP
      # =========================
      - name: Print Summary with Counts
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════════════════════╗"
          echo "║                              SUMMARY STATISTICS                                 ║"
          echo "╠════════════════════════════════════════════════════════════════════════════════╣"
          printf "║  %-35s : %-45s ║\n" "📊 Helmfile Applications" "${{ env.HELMFILE_APPS }}"
          printf "║  %-35s : %-45s ║\n" "📊 Helmfile Clusters" "${{ env.HELMFILE_CLUSTERS }}"
          echo "╠════════════════════════════════════════════════════════════════════════════════╣"
          printf "║  %-35s : %-45s ║\n" "☸️  AKS Clusters" "${{ env.AKS_CLUSTERS }}"
          printf "║  %-35s : %-45s ║\n" "📁 AKS Namespaces (Application)" "${{ env.AKS_NS }}"
          echo "╠════════════════════════════════════════════════════════════════════════════════╣"
          printf "║  %-35s : %-45s ║\n" "✅ Deployed Applications" "${{ env.DEPLOYED_COUNT }}"
          printf "║  %-35s : %-45s ║\n" "❌ Not Deployed Applications" "${{ env.NOT_DEPLOYED_COUNT }}"
          echo "╠════════════════════════════════════════════════════════════════════════════════╣"
          TOTAL=${{ env.HELMFILE_APPS }}
          DEPLOYED=${{ env.DEPLOYED_COUNT }}
          if [ "$TOTAL" -gt 0 ]; then
            COVERAGE=$(echo "scale=2; $DEPLOYED * 100 / $TOTAL" | bc)
            printf "║  %-35s : %-45s ║\n" "📈 Deployment Coverage" "${COVERAGE}%"
          fi
          echo "╚════════════════════════════════════════════════════════════════════════════════╝"
          echo ""

      # =========================
      # STEP 5: PRINT DEPLOYED APPLICATIONS LIST
      # =========================
      - name: Print Deployed Applications List
        run: |
          echo ""
          echo "=============================================="
          echo "DEPLOYED APPLICATIONS ON AKS CLUSTERS"
          echo "=============================================="
          echo ""
          
          # Create AKS lookup
          declare -A aks_lookup
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ] && [ -n "$ns" ]; then
              key="${cluster}|${ns}"
              aks_lookup["$key"]=1
            fi
          done < aks.csv
          
          printf "| %-45s | %-35s | %-30s |\n" "Cluster Name" "Namespaces" "Application Type"
          printf "| %-45s | %-35s | %-30s |\n" "$(printf '%0.s-' {1..45})" "$(printf '%0.s-' {1..35})" "$(printf '%0.s-' {1..30})"
          
          deployed_found=false
          
          tail -n +2 helmfile.csv | sort -t',' -k1,1 -k3,3 | while IFS=',' read -r cluster app namespace; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            if [ -z "$cluster" ] || [ -z "$app" ] || [ -z "$namespace" ]; then
              continue
            fi
            
            key="${cluster}|${namespace}"
            if [[ -n "${aks_lookup[$key]}" ]]; then
              printf "| %-45s | %-35s | %-30s |\n" "$cluster" "$namespace" "$app"
              deployed_found=true
            fi
          done
          
          if [ "$deployed_found" = false ]; then
            echo "No deployed applications found"
          fi
          echo ""

      # =========================
      # STEP 6: PRINT NOT DEPLOYED APPLICATIONS LIST
      # =========================
      - name: Print Not Deployed Applications List
        run: |
          echo ""
          echo "=============================================="
          echo "NOT DEPLOYED APPLICATIONS"
          echo "=============================================="
          echo ""
          
          # Create AKS lookup
          declare -A aks_lookup
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ] && [ -n "$ns" ]; then
              key="${cluster}|${ns}"
              aks_lookup["$key"]=1
            fi
          done < aks.csv
          
          printf "| %-45s | %-35s | %-30s |\n" "Cluster Name" "Namespaces" "Application Type"
          printf "| %-45s | %-35s | %-30s |\n" "$(printf '%0.s-' {1..45})" "$(printf '%0.s-' {1..35})" "$(printf '%0.s-' {1..30})"
          
          not_deployed_found=false
          
          tail -n +2 helmfile.csv | sort -t',' -k1,1 -k3,3 | while IFS=',' read -r cluster app namespace; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            if [ -z "$cluster" ] || [ -z "$app" ] || [ -z "$namespace" ]; then
              continue
            fi
            
            key="${cluster}|${namespace}"
            if [[ -z "${aks_lookup[$key]}" ]]; then
              printf "| %-45s | %-35s | %-30s |\n" "$cluster" "$namespace" "$app"
              not_deployed_found=true
            fi
          done
          
          if [ "$not_deployed_found" = false ]; then
            echo "✅ All applications are deployed!"
          fi
          echo ""

      # =========================
      # UPLOAD REPORTS
      # =========================
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-deployment-reports
          path: |
            helmfile.csv
            aks.csv
          retention-days: 14
