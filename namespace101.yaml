name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # HELMFILE (FINAL CORRECT)
      # =========================
      - name: Generate Helmfile CSV
        run: |
          echo "Cluster,Application,Namespace" > helmfile.csv

          find apps -type f \( -name "helmfile.yaml" -o -name "helmfile.yml" \) 2>/dev/null | while read file; do

            rel_path=${file#apps/}
            IFS='/' read -ra parts <<< "$rel_path"

            app=${parts[0]}
            cluster=${parts[1]}

            # ❌ EXCLUDE APPS
            case "$app" in
              default|trident|tailscale|mtls-outbound|velero)
                continue
                ;;
            esac

            # ✅ HANDLE BOTH STRUCTURES
            if [ "${#parts[@]}" -ge 4 ]; then
              namespace=${parts[2]}
            else
              namespace=$(grep -i "^namespace:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

              if [[ -z "$namespace" || "$namespace" == *"{{"* ]]; then
                namespace="$app"
              fi
            fi

            # Cluster override
            raw_cluster=$(grep -iE "kubeContext:|context:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

            if [[ -n "$raw_cluster" && "$raw_cluster" != *"{{"* ]]; then
              final_cluster="$raw_cluster"
            else
              final_cluster="$cluster"
            fi

            # Skip invalid
            if [[ "$final_cluster" == *"UPDATE"* ]]; then
              continue
            fi

            echo "$final_cluster,$app,$namespace" >> helmfile.csv
          done
          
          echo "=== HELMFILE.CSV CONTENTS ==="
          cat helmfile.csv
          echo "============================"

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # =========================
      # AZURE LOGIN
      # =========================
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # =========================
      # AKS DATA (FIXED VERSION)
      # =========================
      - name: Generate AKS CSV
        run: |
          set +e
          export KUBECONFIG=/tmp/kubeconfig

          echo "Cluster,Namespace,Version" > aks.csv

          az aks list \
            --query "[].{name:name,rg:resourceGroup,version:kubernetesVersion}" \
            -o tsv | while read cluster rg version; do

            echo "Processing $cluster"

            # Get credentials
            az aks get-credentials \
              --resource-group "$rg" \
              --name "$cluster" \
              --overwrite-existing >/dev/null 2>&1

            # Get namespaces
            namespaces=$(kubectl get ns --no-headers 2>/dev/null | awk '{print $1}')
            
            # ❌ unreachable cluster
            if [ -z "$namespaces" ]; then
              echo "$cluster,UNREACHABLE,$version" >> aks.csv
              continue
            fi

            # ✅ Keep real namespaces (excluding system namespaces)
            echo "$namespaces" | grep -vE "kube-|default|azure-|calico|gatekeeper|tigera|trident|kube-public|kube-system" | while read ns; do
              if [ -n "$ns" ]; then
                echo "$cluster,$ns,$version" >> aks.csv
              fi
            done

          done
          
          echo "=== AKS.CSV CONTENTS ==="
          cat aks.csv
          echo "========================"

      # =========================
      # COMPARE (FIXED VERSION)
      # =========================
      - name: Compare Deployment Status
        run: |
          echo "Cluster,Namespace,Application,Deployed,AKS_Namespace_Exists" > comparison.csv
          
          # Create an associative array for AKS namespaces
          # Process AKS CSV to create lookup
          declare -A aks_lookup
          
          tail -n +2 aks.csv | while IFS=',' read -r cluster namespace version; do
            key="${cluster}|${namespace}"
            aks_lookup["$key"]="yes"
          done
          
          # Export the associative array for use in subshell
          declare -p aks_lookup > aks_lookup_env.sh
          
          # Process helmfile entries
          tail -n +2 helmfile.csv | while IFS=',' read -r cluster app namespace; do
            # Trim whitespace
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            # Check if namespace exists in AKS
            found="N"
            aks_namespace=""
            
            # Source the lookup function
            source aks_lookup_env.sh 2>/dev/null || true
            
            # Direct lookup
            key="${cluster}|${namespace}"
            if [[ -n "${aks_lookup[$key]}" ]]; then
              found="Y"
              aks_namespace="$namespace"
            else
              # Try case-insensitive match
              while IFS=',' read -r aks_cluster aks_ns aks_ver; do
                if [[ "$aks_cluster" == "$cluster" && "${aks_ns,,}" == "${namespace,,}" ]]; then
                  found="Y"
                  aks_namespace="$aks_ns"
                  break
                fi
              done < <(tail -n +2 aks.csv)
            fi
            
            echo "$cluster,$namespace,$app,$found,$aks_namespace" >> comparison.csv
          done
          
          echo "=== COMPARISON.CSV CONTENTS ==="
          cat comparison.csv
          echo "=============================="

      # =========================
      # FINAL OUTPUT (FIXED)
      # =========================
      - name: Final Combined Output
        run: |
          echo ""
          echo "=============================================================="
          echo "CLUSTER DEPLOYMENTS (HELMFILE + AKS)"
          echo "=============================================================="
          echo ""

          HELM_COUNT=$(tail -n +2 helmfile.csv 2>/dev/null | wc -l)
          AKS_COUNT=$(tail -n +2 aks.csv 2>/dev/null | wc -l)
          UNREACHABLE=$(grep "UNREACHABLE" aks.csv 2>/dev/null | wc -l)

          echo "========================= SUMMARY ========================="
          printf "%-30s : %s\n" "Total Helmfile Applications" "$HELM_COUNT"
          printf "%-30s : %s\n" "Total AKS Namespaces" "$AKS_COUNT"
          printf "%-30s : %s\n" "Unreachable Clusters" "$UNREACHABLE"
          echo "=========================================================="
          echo ""

          echo "===================== DEPLOYMENT STATUS ====================="
          printf "%-35s %-35s %-35s %-10s %-35s\n" "Cluster" "Namespace" "Application" "Deployed" "AKS Namespace"
          printf "%-35s %-35s %-35s %-10s %-35s\n" "=======" "=========" "===========" "========" "============"
          
          tail -n +2 comparison.csv | sort | while IFS=',' read -r cluster namespace app deployed aks_ns; do
            # Color coding for deployed status
            if [ "$deployed" == "Y" ]; then
              status_icon="✅"
            else
              status_icon="❌"
            fi
            
            printf "%-35s %-35s %-35s %-10s %-35s\n" "$cluster" "$namespace" "$app" "$status_icon $deployed" "$aks_ns"
          done
          
          echo ""
          echo "===================== UNDEPLOYED APPLICATIONS ====================="
          echo ""
          printf "%-35s %-35s %-35s\n" "Cluster" "Namespace" "Application"
          printf "%-35s %-35s %-35s\n" "=======" "=========" "==========="
          
          grep ",N," comparison.csv | while IFS=',' read -r cluster namespace app deployed aks_ns; do
            printf "%-35s %-35s %-35s\n" "$cluster" "$namespace" "$app"
          done

      # =========================
      # DETAILED REPORT
      # =========================
      - name: Generate Detailed Report
        run: |
          cat > detailed-report.md << 'EOF'
          # Helmfile vs AKS Deployment Report
          
          ## Summary Statistics
          
          EOF
          
          echo "| Metric | Count |" >> detailed-report.md
          echo "|--------|-------|" >> detailed-report.md
          echo "| Total Helmfile Applications | $(tail -n +2 helmfile.csv 2>/dev/null | wc -l) |" >> detailed-report.md
          echo "| Total AKS Namespaces | $(tail -n +2 aks.csv 2>/dev/null | wc -l) |" >> detailed-report.md
          echo "| Unreachable Clusters | $(grep "UNREACHABLE" aks.csv 2>/dev/null | wc -l) |" >> detailed-report.md
          echo "| Deployed Applications | $(grep ",Y," comparison.csv 2>/dev/null | wc -l) |" >> detailed-report.md
          echo "| Undeployed Applications | $(grep ",N," comparison.csv 2>/dev/null | wc -l) |" >> detailed-report.md
          echo "" >> detailed-report.md
          
          echo "## Deployment Details" >> detailed-report.md
          echo "" >> detailed-report.md
          echo "| Cluster | Namespace | Application | Status |" >> detailed-report.md
          echo "|---------|-----------|-------------|--------|" >> detailed-report.md
          
          tail -n +2 comparison.csv | sort | while IFS=',' read -r cluster namespace app deployed aks_ns; do
            if [ "$deployed" == "Y" ]; then
              status="✅ Deployed"
            else
              status="❌ Not Deployed"
            fi
            echo "| $cluster | $namespace | $app | $status |" >> detailed-report.md
          done
          
          echo "" >> detailed-report.md
          echo "## Undeployed Applications" >> detailed-report.md
          echo "" >> detailed-report.md
          echo "| Cluster | Namespace | Application |" >> detailed-report.md
          echo "|---------|-----------|-------------|" >> detailed-report.md
          
          grep ",N," comparison.csv | while IFS=',' read -r cluster namespace app deployed aks_ns; do
            echo "| $cluster | $namespace | $app |" >> detailed-report.md
          done
          
          cat detailed-report.md

      # =========================
      # UPLOAD ARTIFACTS
      # =========================
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-deployment-reports
          path: |
            helmfile.csv
            aks.csv
            comparison.csv
            detailed-report.md
          retention-days: 14

      # =========================
      # CREATE SUMMARY
      # =========================
      - name: Create Summary
        run: |
          echo "## 📊 Cluster Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Helmfile Applications | $(tail -n +2 helmfile.csv 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed | $(grep ",Y," comparison.csv 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Not Deployed | $(grep ",N," comparison.csv 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Undeployed Applications" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | Namespace | Application |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
          
          grep ",N," comparison.csv | while IFS=',' read -r cluster namespace app deployed aks_ns; do
            echo "| $cluster | $namespace | $app |" >> $GITHUB_STEP_SUMMARY
          done
