name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # HELMFILE (WITH CLUSTER COUNT)
      # =========================
      - name: Generate Helmfile CSV
        run: |
          echo "Cluster,Application,Namespace" > helmfile.csv
          
          # Create temporary file for tracking unique clusters
          touch helmfile_clusters.txt

          find apps -type f \( -name "helmfile.yaml" -o -name "helmfile.yml" \) 2>/dev/null | while read file; do

            rel_path=${file#apps/}
            IFS='/' read -ra parts <<< "$rel_path"

            app=${parts[0]}
            cluster=${parts[1]}

            # ❌ EXCLUDE APPS (system apps)
            case "$app" in
              default|trident|tailscale|mtls-outbound|velero|calico|gatekeeper|tigera|ingress-nginx|monitoring)
                echo "Skipping system app: $app" >&2
                continue
                ;;
            esac

            # ✅ HANDLE BOTH STRUCTURES
            if [ "${#parts[@]}" -ge 4 ]; then
              namespace=${parts[2]}
            else
              # Try to get namespace from helmfile
              namespace=$(grep -i "^namespace:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

              # If namespace is templated or empty, use app name
              if [[ -z "$namespace" || "$namespace" == *"{{"* ]]; then
                namespace="$app"
              fi
            fi

            # Cluster override
            raw_cluster=$(grep -iE "kubeContext:|context:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

            if [[ -n "$raw_cluster" && "$raw_cluster" != *"{{"* ]]; then
              final_cluster="$raw_cluster"
            else
              final_cluster="$cluster"
            fi

            # Skip invalid
            if [[ "$final_cluster" == *"UPDATE"* ]]; then
              continue
            fi

            echo "$final_cluster,$app,$namespace" >> helmfile.csv
            
            # Track unique clusters
            echo "$final_cluster" >> helmfile_clusters.txt
          done
          
          # Calculate helmfile cluster count
          echo "=== HELMFILE STATISTICS ==="
          echo "Total Helmfile Applications: $(tail -n +2 helmfile.csv 2>/dev/null | wc -l)"
          echo "Unique Helmfile Clusters: $(sort -u helmfile_clusters.txt 2>/dev/null | grep -v '^$' | wc -l)"
          echo ""
          echo "=== HELMFILE CLUSTERS ==="
          sort -u helmfile_clusters.txt 2>/dev/null | grep -v '^$' | while read cluster; do
            app_count=$(grep "^$cluster," helmfile.csv | wc -l)
            echo "  • $cluster: $app_count applications"
          done
          echo ""
          echo "=== HELMFILE.CSV ==="
          cat helmfile.csv
          echo "==================="

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # =========================
      # AZURE LOGIN
      # =========================
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # =========================
      # AKS DATA (WITH CLUSTER AND NAMESPACE COUNTS)
      # =========================
      - name: Generate AKS CSV
        run: |
          set +e
          export KUBECONFIG=/tmp/kubeconfig

          echo "Cluster,Namespace,Version" > aks.csv
          
          # Create temporary files for tracking
          touch aks_clusters.txt
          touch aks_all_namespaces.txt
          touch aks_app_namespaces.txt

          az aks list \
            --query "[].{name:name,rg:resourceGroup,version:kubernetesVersion}" \
            -o tsv | while read cluster rg version; do

            echo "Processing $cluster"

            # Track cluster
            echo "$cluster" >> aks_clusters.txt

            # Get credentials
            az aks get-credentials \
              --resource-group "$rg" \
              --name "$cluster" \
              --overwrite-existing >/dev/null 2>&1

            # Get namespaces
            namespaces=$(kubectl get ns --no-headers 2>/dev/null | awk '{print $1}')
            
            # ❌ unreachable cluster
            if [ -z "$namespaces" ]; then
              echo "$cluster,UNREACHABLE,$version" >> aks.csv
              echo "  Status: UNREACHABLE" >&2
              continue
            fi

            # Count all namespaces (including system)
            total_ns_count=$(echo "$namespaces" | wc -l)
            echo "  Total namespaces: $total_ns_count" >&2
            
            # Track all namespaces for this cluster
            echo "$namespaces" | while read ns; do
              echo "$cluster|$ns|all" >> aks_all_namespaces.txt
            done

            # ✅ ONLY EXCLUDE SYSTEM NAMESPACES
            app_namespaces=$(echo "$namespaces" | grep -vE "aks-command|calico-system|default|gatekeeper-system|kube-node-lease|kube-public|kube-system|tigera-operator|trident" || true)
            
            app_ns_count=$(echo "$app_namespaces" | grep -v '^$' | wc -l)
            echo "  Application namespaces: $app_ns_count" >&2
            
            # Track application namespaces
            echo "$app_namespaces" | grep -v '^$' | while read ns; do
              echo "$cluster,$ns,$version" >> aks.csv
              echo "$cluster|$ns|app" >> aks_app_namespaces.txt
            done

          done
          
          # Calculate statistics
          echo ""
          echo "=== AKS STATISTICS ==="
          echo "Total AKS Clusters: $(sort -u aks_clusters.txt 2>/dev/null | grep -v '^$' | wc -l)"
          echo "Total Namespaces (all): $(cat aks_all_namespaces.txt 2>/dev/null | wc -l)"
          echo "Total Application Namespaces: $(cat aks_app_namespaces.txt 2>/dev/null | wc -l)"
          echo ""
          echo "=== AKS CLUSTERS DETAILS ==="
          sort -u aks_clusters.txt 2>/dev/null | grep -v '^$' | while read cluster; do
            total_ns=$(grep "^$cluster|" aks_all_namespaces.txt 2>/dev/null | wc -l)
            app_ns=$(grep "^$cluster|" aks_app_namespaces.txt 2>/dev/null | wc -l)
            echo "  • $cluster: $total_ns total namespaces, $app_ns application namespaces"
          done
          echo ""
          echo "=== AKS.CSV ==="
          cat aks.csv
          echo "=============="

      # =========================
      # COMPARE WITH COUNTS
      # =========================
      - name: Compare Deployment Status
        run: |
          echo "Cluster,Namespace,Application,Deployed,AKS_Namespace_Match" > comparison.csv
          
          # Create lookup file for AKS namespaces
          tail -n +2 aks.csv | while IFS=',' read -r cluster namespace version; do
            echo "${cluster}|${namespace}" >> aks_namespaces.txt
          done
          
          # Process helmfile entries
          tail -n +2 helmfile.csv | while IFS=',' read -r cluster app namespace; do
            # Trim whitespace
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            # Check if namespace exists in AKS for this cluster
            found="N"
            match_ns=""
            
            if grep -q "^${cluster}|${namespace}$" aks_namespaces.txt 2>/dev/null; then
              found="Y"
              match_ns="$namespace"
            else
              # Try case-insensitive match
              if grep -qi "^${cluster}|${namespace}$" aks_namespaces.txt 2>/dev/null; then
                found="Y"
                match_ns=$(grep -i "^${cluster}|${namespace}$" aks_namespaces.txt | cut -d'|' -f2)
              fi
            fi
            
            echo "$cluster,$namespace,$app,$found,$match_ns" >> comparison.csv
          done
          
          echo "=== COMPARISON.CSV ==="
          cat comparison.csv
          echo "====================="

      # =========================
      # FINAL OUTPUT WITH COMPREHENSIVE COUNTS
      # =========================
      - name: Final Combined Output
        run: |
          echo ""
          echo "=============================================================="
          echo "CLUSTER DEPLOYMENT REPORT"
          echo "=============================================================="
          echo ""
          
          # Calculate Helmfile statistics
          HELMFILE_APPS=$(tail -n +2 helmfile.csv 2>/dev/null | wc -l)
          HELMFILE_CLUSTERS=$(cut -d',' -f1 helmfile.csv 2>/dev/null | tail -n +2 | sort -u | wc -l)
          
          # Calculate AKS statistics
          AKS_CLUSTERS=$(cut -d',' -f1 aks.csv 2>/dev/null | tail -n +2 | grep -v "UNREACHABLE" | sort -u | wc -l)
          AKS_TOTAL_NS=$(tail -n +2 aks.csv 2>/dev/null | grep -v "UNREACHABLE" | wc -l)
          AKS_UNREACHABLE=$(grep "UNREACHABLE" aks.csv 2>/dev/null | wc -l)
          
          # Calculate deployment statistics
          DEPLOYED=$(grep ",Y," comparison.csv 2>/dev/null | wc -l)
          NOT_DEPLOYED=$(grep ",N," comparison.csv 2>/dev/null | wc -l)
          
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                     SUMMARY STATISTICS                         ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          printf "║ %-35s : %-30s ║\n" "Helmfile Applications" "$HELMFILE_APPS"
          printf "║ %-35s : %-30s ║\n" "Helmfile Clusters" "$HELMFILE_CLUSTERS"
          echo "╠────────────────────────────────────────────────────────────────╣"
          printf "║ %-35s : %-30s ║\n" "AKS Clusters (Reachable)" "$AKS_CLUSTERS"
          printf "║ %-35s : %-30s ║\n" "AKS Clusters (Unreachable)" "$AKS_UNREACHABLE"
          printf "║ %-35s : %-30s ║\n" "Total AKS Namespaces" "$AKS_TOTAL_NS"
          echo "╠────────────────────────────────────────────────────────────────╣"
          printf "║ %-35s : %-30s ║\n" "Deployed Applications" "$DEPLOYED"
          printf "║ %-35s : %-30s ║\n" "Not Deployed Applications" "$NOT_DEPLOYED"
          printf "║ %-35s : %-30s ║\n" "Deployment Coverage" "$(echo "scale=2; $DEPLOYED * 100 / $HELMFILE_APPS" | bc)%"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                  HELMFILE CLUSTERS DETAILS                     ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          printf "║ %-35s │ %-15s ║\n" "Cluster Name" "Applications"
          echo "╠────────────────────────────────────────────────────────────────╣"
          
          cut -d',' -f1 helmfile.csv 2>/dev/null | tail -n +2 | sort -u | while read cluster; do
            if [ -n "$cluster" ]; then
              count=$(grep "^$cluster," helmfile.csv | wc -l)
              printf "║ %-35s │ %-15s ║\n" "$cluster" "$count"
            fi
          done
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    AKS CLUSTERS DETAILS                        ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          printf "║ %-35s │ %-15s │ %-15s ║\n" "Cluster Name" "Namespaces" "Status"
          echo "╠════════════════════════════════════════════════════════════════╣"
          
          # Get unique clusters from AKS
          cut -d',' -f1 aks.csv 2>/dev/null | tail -n +2 | sort -u | while read cluster; do
            if [ -n "$cluster" ]; then
              ns_count=$(grep "^$cluster," aks.csv | grep -v "UNREACHABLE" | wc -l)
              if [ "$cluster" == "UNREACHABLE" ]; then
                continue
              fi
              # Check if cluster is reachable
              if grep "^$cluster,UNREACHABLE" aks.csv >/dev/null 2>&1; then
                status="UNREACHABLE"
                ns_count=0
              else
                status="REACHABLE"
              fi
              printf "║ %-35s │ %-15s │ %-15s ║\n" "$cluster" "$ns_count" "$status"
            fi
          done
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              DEPLOYMENT STATUS DETAILS                         ║"
          echo "╠════════════════════════════════════════════════════════════════╣"
          printf "║ %-30s │ %-30s │ %-25s │ %-10s ║\n" "Cluster" "Namespace" "Application" "Status"
          echo "╠════════════════════════════════════════════════════════════════╣"
          
          tail -n +2 comparison.csv | sort | while IFS=',' read -r cluster namespace app deployed aks_ns; do
            if [ "$deployed" == "Y" ]; then
              status="✅ DEPLOYED"
              printf "║ \033[0;32m%-30s\033[0m │ \033[0;32m%-30s\033[0m │ \033[0;32m%-25s\033[0m │ \033[0;32m%-10s\033[0m ║\n" "$cluster" "$namespace" "$app" "$status"
            else
              status="❌ NOT DEPLOYED"
              printf "║ \033[0;31m%-30s\033[0m │ \033[0;31m%-30s\033[0m │ \033[0;31m%-25s\033[0m │ \033[0;31m%-10s\033[0m ║\n" "$cluster" "$namespace" "$app" "$status"
            fi
          done
          echo "╚════════════════════════════════════════════════════════════════╝"
          
          echo ""
          echo "=== NOT DEPLOYED APPLICATIONS ==="
          echo ""
          if [ $NOT_DEPLOYED -gt 0 ]; then
            printf "%-35s %-35s %-35s\n" "Cluster" "Namespace" "Application"
            printf "%-35s %-35s %-35s\n" "=======" "=========" "==========="
            grep ",N," comparison.csv | while IFS=',' read -r cluster namespace app deployed aks_ns; do
              printf "%-35s %-35s %-35s\n" "$cluster" "$namespace" "$app"
            done
          else
            echo "✅ All applications are deployed!"
          fi

      # =========================
      # GENERATE DETAILED MARKDOWN REPORT
      # =========================
      - name: Generate Detailed Markdown Report
        run: |
          cat > detailed-report.md << 'EOF'
          # Cluster Deployment Report
          
          ## 📊 Summary Statistics
          
          EOF
          
          HELMFILE_APPS=$(tail -n +2 helmfile.csv 2>/dev/null | wc -l)
          HELMFILE_CLUSTERS=$(cut -d',' -f1 helmfile.csv 2>/dev/null | tail -n +2 | sort -u | wc -l)
          AKS_CLUSTERS=$(cut -d',' -f1 aks.csv 2>/dev/null | tail -n +2 | grep -v "UNREACHABLE" | sort -u | wc -l)
          AKS_TOTAL_NS=$(tail -n +2 aks.csv 2>/dev/null | grep -v "UNREACHABLE" | wc -l)
          DEPLOYED=$(grep ",Y," comparison.csv 2>/dev/null | wc -l)
          NOT_DEPLOYED=$(grep ",N," comparison.csv 2>/dev/null | wc -l)
          
          echo "| Metric | Value |" >> detailed-report.md
          echo "|--------|-------|" >> detailed-report.md
          echo "| **Helmfile Applications** | $HELMFILE_APPS |" >> detailed-report.md
          echo "| **Helmfile Clusters** | $HELMFILE_CLUSTERS |" >> detailed-report.md
          echo "| **AKS Clusters (Reachable)** | $AKS_CLUSTERS |" >> detailed-report.md
          echo "| **Total AKS Namespaces** | $AKS_TOTAL_NS |" >> detailed-report.md
          echo "| **Deployed Applications** | $DEPLOYED |" >> detailed-report.md
          echo "| **Not Deployed Applications** | $NOT_DEPLOYED |" >> detailed-report.md
          echo "| **Deployment Coverage** | $(echo "scale=2; $DEPLOYED * 100 / $HELMFILE_APPS" | bc)% |" >> detailed-report.md
          echo "" >> detailed-report.md
          
          echo "## 🗂️ Helmfile Clusters" >> detailed-report.md
          echo "" >> detailed-report.md
          echo "| Cluster | Applications |" >> detailed-report.md
          echo "|---------|--------------|" >> detailed-report.md
          cut -d',' -f1 helmfile.csv 2>/dev/null | tail -n +2 | sort -u | while read cluster; do
            if [ -n "$cluster" ]; then
              count=$(grep "^$cluster," helmfile.csv | wc -l)
              echo "| $cluster | $count |" >> detailed-report.md
            fi
          done
          
          echo "" >> detailed-report.md
          echo "## ☸️ AKS Clusters" >> detailed-report.md
          echo "" >> detailed-report.md
          echo "| Cluster | Namespaces | Status |" >> detailed-report.md
          echo "|---------|------------|--------|" >> detailed-report.md
          cut -d',' -f1 aks.csv 2>/dev/null | tail -n +2 | sort -u | while read cluster; do
            if [ -n "$cluster" ] && [ "$cluster" != "UNREACHABLE" ]; then
              ns_count=$(grep "^$cluster," aks.csv | grep -v "UNREACHABLE" | wc -l)
              echo "| $cluster | $ns_count | Reachable |" >> detailed-report.md
            fi
          done
          
          echo "" >> detailed-report.md
          echo "## 📋 Deployment Status" >> detailed-report.md
          echo "" >> detailed-report.md
          echo "| Cluster | Namespace | Application | Status |" >> detailed-report.md
          echo "|---------|-----------|-------------|--------|" >> detailed-report.md
          
          tail -n +2 comparison.csv | sort | while IFS=',' read -r cluster namespace app deployed aks_ns; do
            if [ "$deployed" == "Y" ]; then
              status="✅ Deployed"
            else
              status="❌ Not Deployed"
            fi
            echo "| $cluster | $namespace | $app | $status |" >> detailed-report.md
          done
          
          echo "" >> detailed-report.md
          echo "## ⚠️ Undeployed Applications" >> detailed-report.md
          echo "" >> detailed-report.md
          if [ $NOT_DEPLOYED -gt 0 ]; then
            echo "| Cluster | Namespace | Application |" >> detailed-report.md
            echo "|---------|-----------|-------------|" >> detailed-report.md
            grep ",N," comparison.csv | while IFS=',' read -r cluster namespace app deployed aks_ns; do
              echo "| $cluster | $namespace | $app |" >> detailed-report.md
            done
          else
            echo "✅ All applications are deployed!" >> detailed-report.md
          fi
          
          cat detailed-report.md

      # =========================
      # UPLOAD REPORTS
      # =========================
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-deployment-reports
          path: |
            helmfile.csv
            aks.csv
            comparison.csv
            detailed-report.md
          retention-days: 14

      # =========================
      # CREATE GITHUB SUMMARY
      # =========================
      - name: Create GitHub Summary
        run: |
          HELMFILE_APPS=$(tail -n +2 helmfile.csv 2>/dev/null | wc -l)
          HELMFILE_CLUSTERS=$(cut -d',' -f1 helmfile.csv 2>/dev/null | tail -n +2 | sort -u | wc -l)
          AKS_CLUSTERS=$(cut -d',' -f1 aks.csv 2>/dev/null | tail -n +2 | grep -v "UNREACHABLE" | sort -u | wc -l)
          AKS_TOTAL_NS=$(tail -n +2 aks.csv 2>/dev/null | grep -v "UNREACHABLE" | wc -l)
          DEPLOYED=$(grep ",Y," comparison.csv 2>/dev/null | wc -l)
          NOT_DEPLOYED=$(grep ",N," comparison.csv 2>/dev/null | wc -l)
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📊 Cluster Deployment Summary
          
          | Metric | Value |
          |--------|-------|
          | 🗂️ **Helmfile Applications** | $HELMFILE_APPS |
          | 🗂️ **Helmfile Clusters** | $HELMFILE_CLUSTERS |
          | ☸️ **AKS Clusters (Reachable)** | $AKS_CLUSTERS |
          | 📁 **Total AKS Namespaces** | $AKS_TOTAL_NS |
          | ✅ **Deployed Applications** | $DEPLOYED |
          | ❌ **Not Deployed Applications** | $NOT_DEPLOYED |
          | 📈 **Deployment Coverage** | $(echo "scale=2; $DEPLOYED * 100 / $HELMFILE_APPS" | bc)% |
          
          EOF
          
          if [ $NOT_DEPLOYED -gt 0 ]; then
            echo "### ⚠️ Undeployed Applications" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Cluster | Namespace | Application |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
            grep ",N," comparison.csv | while IFS=',' read -r cluster namespace app deployed aks_ns; do
              echo "| $cluster | $namespace | $app |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "✅ **All applications are deployed!**" >> $GITHUB_STEP_SUMMARY
          fi
