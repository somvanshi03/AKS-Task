name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # HELMFILE (FINAL)
      # =========================
      - name: Generate Helmfile CSV
        run: |
          echo "Cluster,Application,Namespace" > helmfile.csv

          find apps -type f \( -name "helmfile.yaml" -o -name "helmfile.yml" \) 2>/dev/null | while read file; do

            rel_path=${file#apps/}
            IFS='/' read -ra parts <<< "$rel_path"

            app=${parts[0]}
            cluster=${parts[1]}

            # ❌ EXCLUDE APPS
            case "$app" in
              default|trident|tailscale|mtls-outbound|velero)
                continue
                ;;
            esac

            # ✅ HANDLE BOTH STRUCTURES
            if [ "${#parts[@]}" -ge 4 ]; then
              namespace=${parts[2]}
            else
              namespace=$(grep -i "^namespace:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

              if [[ -z "$namespace" || "$namespace" == *"{{"* ]]; then
                namespace="$app"
              fi
            fi

            # Cluster override
            raw_cluster=$(grep -iE "kubeContext:|context:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

            if [[ -n "$raw_cluster" && "$raw_cluster" != *"{{"* ]]; then
              final_cluster="$raw_cluster"
            else
              final_cluster="$cluster"
            fi

            # ❌ Skip invalid clusters
            if [[ "$final_cluster" == *"UPDATE"* ]]; then
              continue
            fi

            echo "$final_cluster,$app,$namespace" >> helmfile.csv
          done

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # =========================
      # AZURE LOGIN
      # =========================
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # =========================
      # AKS DATA (RESILIENT)
      # =========================
      - name: Generate AKS CSV
        run: |
          set +e
          export KUBECONFIG=/tmp/kubeconfig

          echo "Cluster,Application,Namespace,Version" > aks.csv

          az aks list \
            --query "[].{name:name,rg:resourceGroup,version:kubernetesVersion}" \
            -o tsv | while read cluster rg version; do

            echo "Processing $cluster"

            az aks get-credentials \
              --resource-group "$rg" \
              --name "$cluster" \
              --overwrite-existing >/dev/null 2>&1

            namespaces=$(kubectl get ns --no-headers 2>/dev/null | awk '{print $1}')

            # ❌ Unreachable cluster
            if [ -z "$namespaces" ]; then
              echo "Skipping $cluster (UNREACHABLE)"
              echo "$cluster,UNREACHABLE,UNREACHABLE,$version" >> aks.csv
              continue
            fi

            echo "$namespaces" | grep -vE "kube-|default|azure-|calico|gatekeeper|tigera|trident" | while read ns; do

              # ✅ CORRECT APP MAPPING
              case "$ns" in
                flows-*) app="flows" ;;
                ih-*) app="invhub" ;;
                nr-*) app="netreveal" ;;
                common-res) app="common-res" ;;
                datadog) app="datadog" ;;
                *) app="$ns" ;;
              esac

              echo "$cluster,$app,$ns,$version" >> aks.csv
            done

          done

      # =========================
      # COMPARE
      # =========================
      - name: Compare Deployment Status
        run: |
          echo "Cluster,Namespace,Application,Deployed" > comparison.csv

          tail -n +2 helmfile.csv | while IFS=',' read -r cluster app namespace; do

            match=$(grep "^${cluster},.*,$namespace," aks.csv || true)

            if [ -n "$match" ]; then
              deployed="Y"
            else
              deployed="N"
            fi

            echo "$cluster,$namespace,$app,$deployed" >> comparison.csv
          done

      # =========================
      # FINAL OUTPUT (CLEAN FORMAT)
      # =========================
      - name: Final Combined Output
        run: |
          echo ""
          echo "=============================================================="
          echo "CLUSTER DEPLOYMENTS (HELMFILE + AKS)"
          echo "=============================================================="
          echo ""

          HELM_COUNT=$(tail -n +2 helmfile.csv | cut -d',' -f1 | sort -u | wc -l)
          AKS_COUNT=$(tail -n +2 aks.csv | cut -d',' -f1 | sort -u | wc -l)
          UNREACHABLE=$(grep "UNREACHABLE" aks.csv | cut -d',' -f1 | sort -u | wc -l)

          echo "========================= SUMMARY ========================="
          echo "Total Helmfile Clusters : $HELM_COUNT"
          echo "Total AKS Clusters      : $AKS_COUNT"
          echo "Unreachable Clusters    : $UNREACHABLE"
          echo "=========================================================="
          echo ""

          echo "===================== DEPLOYMENT STATUS ====================="

          printf "%-40s %-35s %-25s %-10s\n" "Cluster Name" "Namespaces" "Application Type" "Deployed Y/N"
          printf "%-40s %-35s %-25s %-10s\n" "============" "===========" "================" "============"

          prev_cluster=""

          tail -n +2 comparison.csv | sort | while IFS=',' read -r cluster ns app deployed; do

            if [ "$cluster" != "$prev_cluster" ]; then
              printf "%-40s %-35s %-25s %-10s\n" "$cluster" "$ns" "$app" "$deployed"
              prev_cluster="$cluster"
            else
              printf "%-40s %-35s %-25s %-10s\n" "" "$ns" "$app" "$deployed"
            fi

          done
