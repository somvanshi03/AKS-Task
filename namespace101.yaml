name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # HELMFILE (WITH CLUSTER COUNT)
      # =========================
      - name: Generate Helmfile CSV
        run: |
          echo "Cluster,Application,Namespace" > helmfile.csv
          
          # Create temporary file for tracking unique clusters
          touch helmfile_clusters.txt

          find apps -type f \( -name "helmfile.yaml" -o -name "helmfile.yml" \) 2>/dev/null | while read file; do

            rel_path=${file#apps/}
            IFS='/' read -ra parts <<< "$rel_path"

            app=${parts[0]}
            cluster=${parts[1]}

            # ❌ EXCLUDE APPS (system apps)
            case "$app" in
              default|trident|tailscale|mtls-outbound|velero|calico|gatekeeper|tigera|ingress-nginx|monitoring)
                echo "Skipping system app: $app" >&2
                continue
                ;;
            esac

            # ✅ HANDLE BOTH STRUCTURES
            if [ "${#parts[@]}" -ge 4 ]; then
              namespace=${parts[2]}
            else
              # Try to get namespace from helmfile
              namespace=$(grep -i "^namespace:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

              # If namespace is templated or empty, use app name
              if [[ -z "$namespace" || "$namespace" == *"{{"* ]]; then
                namespace="$app"
              fi
            fi

            # Cluster override
            raw_cluster=$(grep -iE "kubeContext:|context:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

            if [[ -n "$raw_cluster" && "$raw_cluster" != *"{{"* ]]; then
              final_cluster="$raw_cluster"
            else
              final_cluster="$cluster"
            fi

            # Skip invalid
            if [[ "$final_cluster" == *"UPDATE"* ]]; then
              continue
            fi

            echo "$final_cluster,$app,$namespace" >> helmfile.csv
            
            # Track unique clusters
            echo "$final_cluster" >> helmfile_clusters.txt
          done
          
          # Store counts for later use
          HELMFILE_APPS=$(tail -n +2 helmfile.csv 2>/dev/null | wc -l)
          HELMFILE_CLUSTERS=$(sort -u helmfile_clusters.txt 2>/dev/null | grep -v '^$' | wc -l)
          
          echo "HELMFILE_APPS=$HELMFILE_APPS" >> $GITHUB_ENV
          echo "HELMFILE_CLUSTERS=$HELMFILE_CLUSTERS" >> $GITHUB_ENV
          
          echo "=== HELMFILE STATISTICS ==="
          echo "Total Helmfile Applications: $HELMFILE_APPS"
          echo "Unique Helmfile Clusters: $HELMFILE_CLUSTERS"
          echo ""

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # =========================
      # AZURE LOGIN
      # =========================
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # =========================
      # AKS DATA (WITH CLUSTER AND NAMESPACE COUNTS)
      # =========================
      - name: Generate AKS CSV
        run: |
          set +e
          export KUBECONFIG=/tmp/kubeconfig

          echo "Cluster,Namespace,Version" > aks.csv
          
          # Create temporary files for tracking
          touch aks_clusters.txt
          touch unreachable_clusters.txt

          az aks list \
            --query "[].{name:name,rg:resourceGroup,version:kubernetesVersion}" \
            -o tsv | while read cluster rg version; do

            echo "Processing $cluster"

            # Get credentials
            az aks get-credentials \
              --resource-group "$rg" \
              --name "$cluster" \
              --overwrite-existing >/dev/null 2>&1

            # Get namespaces
            namespaces=$(kubectl get ns --no-headers 2>/dev/null | awk '{print $1}')
            
            # ❌ unreachable cluster
            if [ -z "$namespaces" ]; then
              echo "$cluster,UNREACHABLE,$version" >> aks.csv
              echo "$cluster" >> unreachable_clusters.txt
              echo "  Status: UNREACHABLE" >&2
              continue
            fi
            
            # Track reachable cluster
            echo "$cluster" >> aks_clusters.txt

            # ✅ ONLY EXCLUDE SYSTEM NAMESPACES
            echo "$namespaces" | grep -vE "aks-command|calico-system|default|gatekeeper-system|kube-node-lease|kube-public|kube-system|tigera-operator|trident" | while read ns; do
              if [ -n "$ns" ]; then
                echo "$cluster,$ns,$version" >> aks.csv
              fi
            done

          done
          
          # Store counts for later use
          AKS_CLUSTERS=$(sort -u aks_clusters.txt 2>/dev/null | grep -v '^$' | wc -l)
          UNREACHABLE_CLUSTERS=$(sort -u unreachable_clusters.txt 2>/dev/null | grep -v '^$' | wc -l)
          TOTAL_NS=$(tail -n +2 aks.csv 2>/dev/null | grep -v "UNREACHABLE" | wc -l)
          
          echo "AKS_CLUSTERS=$AKS_CLUSTERS" >> $GITHUB_ENV
          echo "UNREACHABLE_CLUSTERS=$UNREACHABLE_CLUSTERS" >> $GITHUB_ENV
          echo "TOTAL_NS=$TOTAL_NS" >> $GITHUB_ENV
          
          echo ""
          echo "=== AKS STATISTICS ==="
          echo "Total AKS Clusters (Reachable): $AKS_CLUSTERS"
          echo "Total AKS Clusters (Unreachable): $UNREACHABLE_CLUSTERS"
          echo "Total Application Namespaces: $TOTAL_NS"
          echo ""

      # =========================
      # COMPARE AND GENERATE FINAL TABLE
      # =========================
      - name: Generate Final Output with Counts
        run: |
          # Create lookup for AKS namespaces
          declare -A aks_ns_map
          
          # Build AKS namespace lookup
          while IFS=',' read -r cluster namespace version; do
            if [ "$cluster" != "Cluster" ] && [ "$namespace" != "UNREACHABLE" ]; then
              aks_ns_map["$cluster|$namespace"]=1
            fi
          done < aks.csv
          
          # Calculate deployed and not deployed counts
          deployed_count=0
          not_deployed_count=0
          
          # First pass to count
          while IFS=',' read -r cluster app namespace; do
            if [ "$cluster" != "Cluster" ]; then
              cluster=$(echo "$cluster" | xargs)
              namespace=$(echo "$namespace" | xargs)
              if [[ -n "${aks_ns_map["$cluster|$namespace"]}" ]]; then
                deployed_count=$((deployed_count + 1))
              else
                not_deployed_count=$((not_deployed_count + 1))
              fi
            fi
          done < helmfile.csv
          
          # Store counts
          echo "DEPLOYED_COUNT=$deployed_count" >> $GITHUB_ENV
          echo "NOT_DEPLOYED_COUNT=$not_deployed_count" >> $GITHUB_ENV
          
          # Calculate deployment percentage
          total_apps=$((deployed_count + not_deployed_count))
          if [ $total_apps -gt 0 ]; then
            deployment_pct=$(echo "scale=2; $deployed_count * 100 / $total_apps" | bc)
          else
            deployment_pct=0
          fi
          
          echo "DEPLOYMENT_PCT=$deployment_pct" >> $GITHUB_ENV
          
          # Generate the final output with counts at the top
          echo ""
          echo "=============================================================="
          echo "CLUSTER DEPLOYMENTS (HELMFILE + AKS)"
          echo "=============================================================="
          echo ""
          
          # Display counts in the format you want
          printf "%-30s : %s\n" "Total Helmfile Clusters" "${{ env.HELMFILE_CLUSTERS }}"
          printf "%-30s : %s\n" "Total AKS Clusters" "${{ env.AKS_CLUSTERS }}"
          printf "%-30s : %s\n" "Unreachable Clusters" "${{ env.UNREACHABLE_CLUSTERS }}"
          echo ""
          printf "%-30s : %s\n" "Total Helmfile Applications" "$total_apps"
          printf "%-30s : %s\n" "Total AKS Namespaces" "${{ env.TOTAL_NS }}"
          echo ""
          printf "%-30s : %s\n" "Deployed Applications" "$deployed_count"
          printf "%-30s : %s\n" "Not Deployed Applications" "$not_deployed_count"
          printf "%-30s : %s%%\n" "Deployment Coverage" "$deployment_pct"
          
          echo ""
          echo "=============================================================="
          echo "DEPLOYMENT STATUS"
          echo "=============================================================="
          echo ""
          
          # Print header
          printf "%-40s %-35s %-25s %-10s\n" "Cluster Name" "Namespaces" "Application Type" "Deployed Y/N"
          printf "%-40s %-35s %-25s %-10s\n" "============" "===========" "================" "============"
          
          # Track previous cluster for grouping
          prev_cluster=""
          
          # Process helmfile entries and sort by cluster, then namespace
          tail -n +2 helmfile.csv | sort -t',' -k1,1 -k3,3 | while IFS=',' read -r cluster app namespace; do
            # Trim whitespace
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            # Check if namespace exists in AKS
            if [[ -n "${aks_ns_map["$cluster|$namespace"]}" ]]; then
              deployed="Y"
            else
              deployed="N"
            fi
            
            # Print with grouping
            if [ "$cluster" != "$prev_cluster" ]; then
              # Print new cluster with full details
              printf "%-40s %-35s %-25s %-10s\n" "$cluster" "$namespace" "$app" "$deployed"
              prev_cluster="$cluster"
            else
              # Print same cluster with empty cluster name (for grouping)
              printf "%-40s %-35s %-25s %-10s\n" "" "$namespace" "$app" "$deployed"
            fi
          done
          
          echo ""
          echo "=============================================================="

      # =========================
      # CREATE COMPARISON CSV FOR STATISTICS
      # =========================
      - name: Create Comparison CSV
        run: |
          echo "Cluster,Namespace,Application,Deployed" > comparison.csv
          
          # Create lookup for AKS namespaces
          declare -A aks_ns_map
          
          # Build AKS namespace lookup
          while IFS=',' read -r cluster namespace version; do
            if [ "$cluster" != "Cluster" ] && [ "$namespace" != "UNREACHABLE" ]; then
              aks_ns_map["$cluster|$namespace"]=1
            fi
          done < aks.csv
          
          # Process helmfile entries
          tail -n +2 helmfile.csv | while IFS=',' read -r cluster app namespace; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            # Check if namespace exists in AKS
            if [[ -n "${aks_ns_map["$cluster|$namespace"]}" ]]; then
              deployed="Y"
            else
              deployed="N"
            fi
            
            echo "$cluster,$namespace,$app,$deployed" >> comparison.csv
          done

      # =========================
      # UPLOAD REPORTS
      # =========================
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-deployment-reports
          path: |
            helmfile.csv
            aks.csv
            comparison.csv
          retention-days: 14

      # =========================
      # CREATE GITHUB SUMMARY
      # =========================
      - name: Create GitHub Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📊 Cluster Deployment Summary
          
          ### Cluster Statistics
          
          | Metric | Value |
          |--------|-------|
          | **Total Helmfile Clusters** | ${{ env.HELMFILE_CLUSTERS }} |
          | **Total AKS Clusters** | ${{ env.AKS_CLUSTERS }} |
          | **Unreachable Clusters** | ${{ env.UNREACHABLE_CLUSTERS }} |
          
          ### Application Statistics
          
          | Metric | Value |
          |--------|-------|
          | **Total Helmfile Applications** | $(( ${{ env.DEPLOYED_COUNT }} + ${{ env.NOT_DEPLOYED_COUNT }} )) |
          | **Total AKS Namespaces** | ${{ env.TOTAL_NS }} |
          | **Deployed Applications** | ${{ env.DEPLOYED_COUNT }} |
          | **Not Deployed Applications** | ${{ env.NOT_DEPLOYED_COUNT }} |
          | **Deployment Coverage** | ${{ env.DEPLOYMENT_PCT }}% |
          
          ### Deployment Details
          
          | Cluster Name | Namespaces | Application Type | Deployed Y/N |
          |--------------|------------|------------------|--------------|
          EOF
          
          # Add table rows to summary
          tail -n +2 comparison.csv | sort | while IFS=',' read -r cluster namespace app deployed; do
            echo "| $cluster | $namespace | $app | $deployed |" >> $GITHUB_STEP_SUMMARY
          done
          
          if [ ${{ env.NOT_DEPLOYED_COUNT }} -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Undeployed Applications" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Cluster | Namespace | Application |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
            grep ",N," comparison.csv | while IFS=',' read -r cluster namespace app deployed; do
              echo "| $cluster | $namespace | $app |" >> $GITHUB_STEP_SUMMARY
            done
          fi
