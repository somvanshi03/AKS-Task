name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # STEP 1: LIST ALL CLUSTERS FROM HELMFILE IN /app DIR
      # =========================
      - name: List Helmfile Clusters and Applications
        run: |
          echo "=============================================="
          echo "STEP 1: HELMFILE APPLICATIONS FROM /app DIRECTORY"
          echo "=============================================="
          echo ""
          
          # Create helmfile CSV
          echo "Cluster,Application,Namespace" > helmfile.csv
          
          # Find all helmfile files
          find app -type f \( -name "helmfile.yaml" -o -name "helmfile.yml" \) 2>/dev/null | while read file; do
            # Extract path structure: app/<app_name>/<cluster_name>/helmfile.yaml
            rel_path=${file#app/}
            IFS='/' read -ra parts <<< "$rel_path"
            
            # Get app name (first directory after app/)
            app_name=${parts[0]}
            
            # Skip excluded applications
            case "$app_name" in
              default|trident|tailscale|mtls-outbound|velero)
                echo "Skipping excluded app: $app_name"
                continue
                ;;
            esac
            
            # Get cluster name (second directory)
            if [ ${#parts[@]} -ge 2 ]; then
              cluster_name=${parts[1]}
            else
              cluster_name="unknown"
            fi
            
            # Extract namespace from helmfile
            namespace=""
            
            # Try to get namespace from helmfile
            if [ -f "$file" ]; then
              namespace=$(grep -E "^[[:space:]]*namespace:" "$file" | head -1 | sed 's/.*namespace:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
              
              # If namespace is templated or empty, try values.yaml
              if [[ -z "$namespace" ]] || [[ "$namespace" == *"{{"* ]]; then
                values_file=$(dirname "$file")/values.yaml
                if [ -f "$values_file" ]; then
                  namespace=$(grep -E "^[[:space:]]*namespace:" "$values_file" | head -1 | sed 's/.*namespace:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
                fi
              fi
              
              # If still no namespace, use app name
              if [[ -z "$namespace" ]] || [[ "$namespace" == *"{{"* ]]; then
                namespace="$app_name"
              fi
            fi
            
            # Check for cluster override in helmfile
            raw_cluster=$(grep -iE "kubeContext:|context:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")
            if [[ -n "$raw_cluster" && "$raw_cluster" != *"{{"* ]]; then
              final_cluster="$raw_cluster"
            else
              final_cluster="$cluster_name"
            fi
            
            # Add to CSV
            echo "$final_cluster,$app_name,$namespace" >> helmfile.csv
            echo "Found: $final_cluster | $app_name | $namespace"
          done
          
          # Remove duplicates
          sort -u helmfile.csv -o helmfile.csv
          
          echo ""
          echo "=== HELMFILE SUMMARY ==="
          echo "Total applications: $(tail -n +2 helmfile.csv | wc -l)"
          echo "Unique clusters: $(tail -n +2 helmfile.csv | cut -d',' -f1 | sort -u | wc -l)"
          echo ""

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # =========================
      # AZURE LOGIN
      # =========================
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # =========================
      # STEP 2: LIST ALL AKS CLUSTERS WITH NAMESPACES AND APPLICATIONS
      # =========================
      - name: List AKS Clusters with Namespaces
        run: |
          echo ""
          echo "=============================================="
          echo "STEP 2: AKS CLUSTERS WITH NAMESPACES"
          echo "=============================================="
          echo ""
          
          export KUBECONFIG=/tmp/kubeconfig
          
          echo "Cluster,Namespace" > aks.csv
          
          # Get all AKS clusters
          az aks list --query "[].{name:name,rg:resourceGroup}" -o tsv | while read cluster rg; do
            echo "Processing cluster: $cluster"
            
            # Get credentials
            az aks get-credentials --resource-group "$rg" --name "$cluster" --overwrite-existing >/dev/null 2>&1
            
            if [ $? -eq 0 ]; then
              # Get all namespaces (exclude system namespaces)
              kubectl get ns --no-headers 2>/dev/null | awk '{print $1}' | grep -vE "kube-|default|azure-|calico-|gatekeeper-|tigera-|trident|aks-command" | while read ns; do
                if [ -n "$ns" ]; then
                  echo "$cluster,$ns" >> aks.csv
                  echo "  Found namespace: $ns"
                fi
              done
            else
              echo "  Failed to connect to cluster: $cluster"
            fi
          done
          
          echo ""
          echo "=== AKS SUMMARY ==="
          echo "Total clusters: $(tail -n +2 aks.csv | cut -d',' -f1 | sort -u | wc -l)"
          echo "Total namespaces: $(tail -n +2 aks.csv | wc -l)"
          echo ""

      # =========================
      # STEP 3: COMPARE AND PRINT DEPLOYMENT STATUS
      # =========================
      - name: Compare and Print Deployment Status
        run: |
          echo ""
          echo "=============================================="
          echo "STEP 3: DEPLOYMENT STATUS COMPARISON"
          echo "=============================================="
          echo ""
          
          # Create AKS namespace lookup (cluster|namespace)
          declare -A aks_lookup
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ]; then
              key="${cluster}|${ns}"
              aks_lookup["$key"]=1
            fi
          done < aks.csv
          
          # Calculate statistics
          total_apps=$(tail -n +2 helmfile.csv | wc -l)
          deployed=0
          not_deployed=0
          
          # Process helmfile entries
          echo "DEPLOYMENT STATUS:"
          echo "-----------------"
          printf "%-45s %-35s %-30s %-12s\n" "Cluster Name" "Namespace" "Application" "Deployed"
          printf "%-45s %-35s %-30s %-12s\n" "============" "=========" "===========" "========"
          
          # Track previous cluster for grouping
          prev_cluster=""
          
          # Sort by cluster and namespace
          tail -n +2 helmfile.csv | sort -t',' -k1,1 -k3,3 | while IFS=',' read -r cluster app namespace; do
            # Trim whitespace
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            # Check if deployed in AKS
            key="${cluster}|${namespace}"
            if [[ -n "${aks_lookup[$key]}" ]]; then
              deployed_status="Y"
              deployed=$((deployed + 1))
            else
              deployed_status="N"
              not_deployed=$((not_deployed + 1))
            fi
            
            # Print with grouping
            if [ "$cluster" != "$prev_cluster" ]; then
              printf "%-45s %-35s %-30s %-12s\n" "$cluster" "$namespace" "$app" "$deployed_status"
              prev_cluster="$cluster"
            else
              printf "%-45s %-35s %-30s %-12s\n" "" "$namespace" "$app" "$deployed_status"
            fi
          done
          
          # Store counts for summary
          echo "DEPLOYED_COUNT=$deployed" >> $GITHUB_ENV
          echo "NOT_DEPLOYED_COUNT=$not_deployed" >> $GITHUB_ENV
          echo "TOTAL_APPS=$total_apps" >> $GITHUB_ENV
          
          echo ""
          echo "=============================================="

      # =========================
      # STEP 4: PRINT SUMMARY STATISTICS
      # =========================
      - name: Print Summary Statistics
        run: |
          echo ""
          echo "=============================================="
          echo "SUMMARY STATISTICS"
          echo "=============================================="
          echo ""
          
          # Calculate helmfile clusters
          HELMFILE_CLUSTERS=$(tail -n +2 helmfile.csv | cut -d',' -f1 | sort -u | wc -l)
          
          # Calculate AKS clusters
          AKS_CLUSTERS=$(tail -n +2 aks.csv | cut -d',' -f1 | sort -u | wc -l)
          
          # Calculate unique namespaces
          AKS_NAMESPACES=$(tail -n +2 aks.csv | wc -l)
          
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║                     CLUSTER STATISTICS                        ║"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          printf "║ %-35s : %-30s ║\n" "Helmfile Clusters" "$HELMFILE_CLUSTERS"
          printf "║ %-35s : %-30s ║\n" "AKS Clusters" "$AKS_CLUSTERS"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          echo "║                   APPLICATION STATISTICS                      ║"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          printf "║ %-35s : %-30s ║\n" "Total Helmfile Applications" "${{ env.TOTAL_APPS }}"
          printf "║ %-35s : %-30s ║\n" "Total AKS Namespaces" "$AKS_NAMESPACES"
          echo "╠═══════════════════════════════════════════════════════════════╣"
          printf "║ %-35s : %-30s ║\n" "Deployed Applications" "${{ env.DEPLOYED_COUNT }}"
          printf "║ %-35s : %-30s ║\n" "Not Deployed Applications" "${{ env.NOT_DEPLOYED_COUNT }}"
          if [ ${{ env.TOTAL_APPS }} -gt 0 ]; then
            coverage=$(echo "scale=2; ${{ env.DEPLOYED_COUNT }} * 100 / ${{ env.TOTAL_APPS }}" | bc)
            printf "║ %-35s : %-30s ║\n" "Deployment Coverage" "$coverage%"
          fi
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""

      # =========================
      # LIST UNDEPLOYED APPLICATIONS
      # =========================
      - name: List Undeployed Applications
        run: |
          # Create AKS namespace lookup
          declare -A aks_lookup
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ]; then
              key="${cluster}|${ns}"
              aks_lookup["$key"]=1
            fi
          done < aks.csv
          
          echo ""
          echo "=============================================="
          echo "UNDEPLOYED APPLICATIONS"
          echo "=============================================="
          echo ""
          
          undeployed_found=false
          
          tail -n +2 helmfile.csv | sort | while IFS=',' read -r cluster app namespace; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            key="${cluster}|${namespace}"
            if [[ -z "${aks_lookup[$key]}" ]]; then
              if [ "$undeployed_found" = false ]; then
                printf "%-45s %-35s %-30s\n" "Cluster Name" "Namespace" "Application"
                printf "%-45s %-35s %-30s\n" "============" "=========" "==========="
                undeployed_found=true
              fi
              printf "%-45s %-35s %-30s\n" "$cluster" "$namespace" "$app"
            fi
          done
          
          if [ "$undeployed_found" = false ]; then
            echo "✅ All applications are deployed!"
          fi
          
          echo ""

      # =========================
      # UPLOAD REPORTS
      # =========================
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-deployment-reports
          path: |
            helmfile.csv
            aks.csv
          retention-days: 14

      # =========================
      # CREATE GITHUB SUMMARY
      # =========================
      - name: Create GitHub Summary
        run: |
          # Calculate statistics
          HELMFILE_CLUSTERS=$(tail -n +2 helmfile.csv | cut -d',' -f1 | sort -u | wc -l)
          AKS_CLUSTERS=$(tail -n +2 aks.csv | cut -d',' -f1 | sort -u | wc -l)
          AKS_NAMESPACES=$(tail -n +2 aks.csv | wc -l)
          
          if [ ${{ env.TOTAL_APPS }} -gt 0 ]; then
            coverage=$(echo "scale=2; ${{ env.DEPLOYED_COUNT }} * 100 / ${{ env.TOTAL_APPS }}" | bc)
          else
            coverage=0
          fi
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📊 Cluster Deployment Summary
          
          ### Cluster Statistics
          | Metric | Value |
          |--------|-------|
          | **Helmfile Clusters** | $HELMFILE_CLUSTERS |
          | **AKS Clusters** | $AKS_CLUSTERS |
          
          ### Application Statistics
          | Metric | Value |
          |--------|-------|
          | **Total Helmfile Applications** | ${{ env.TOTAL_APPS }} |
          | **Total AKS Namespaces** | $AKS_NAMESPACES |
          | **Deployed Applications** | ${{ env.DEPLOYED_COUNT }} |
          | **Not Deployed Applications** | ${{ env.NOT_DEPLOYED_COUNT }} |
          | **Deployment Coverage** | ${coverage}% |
          
          ### Deployment Details
          | Cluster Name | Namespace | Application | Deployed |
          |--------------|-----------|-------------|----------|
          EOF
          
          # Create AKS lookup for summary
          declare -A aks_lookup_summary
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ]; then
              aks_lookup_summary["${cluster}|${ns}"]=1
            fi
          done < aks.csv
          
          # Add table rows
          tail -n +2 helmfile.csv | sort | while IFS=',' read -r cluster app namespace; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            key="${cluster}|${namespace}"
            if [[ -n "${aks_lookup_summary[$key]}" ]]; then
              deployed="✅ Y"
            else
              deployed="❌ N"
            fi
            
            echo "| $cluster | $namespace | $app | $deployed |" >> $GITHUB_STEP_SUMMARY
          done
          
          if [ ${{ env.NOT_DEPLOYED_COUNT }} -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Undeployed Applications" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Cluster | Namespace | Application |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
            
            tail -n +2 helmfile.csv | while IFS=',' read -r cluster app namespace; do
              cluster=$(echo "$cluster" | xargs)
              app=$(echo "$app" | xargs)
              namespace=$(echo "$namespace" | xargs)
              
              key="${cluster}|${namespace}"
              if [[ -z "${aks_lookup_summary[$key]}" ]]; then
                echo "| $cluster | $namespace | $app |" >> $GITHUB_STEP_SUMMARY
              fi
            done | sort -u
          fi
