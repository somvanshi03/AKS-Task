name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # INSTALL + LOGIN
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

      # =========================
      # FETCH AKS CLUSTERS
      # =========================
      - name: Fetch AKS clusters
        run: |
          az aks list --query "[].name" -o tsv > aks_clusters.txt

      # =========================
      # HELMFILE OUTPUT (Save to file)
      # =========================
      - name: Print Helmfile Data
        run: |
          echo ""
          echo "================ HELMFILE DATA ================="

          printf "%-35s %-25s %-25s\n" \
          "Cluster Name" "Namespace" "Application"

          printf "%-35s %-25s %-25s\n" \
          "============" "=========" "==========="

          EXCLUDED="trident|tailscale|velero|mtls-outbound|default"
          
          # Save to file for comparison
          > helmfile_data.txt

          find apps -type f -name "helmfile.yaml" | while read file; do

            rel=${file#apps/}
            IFS='/' read -ra p <<< "$rel"

            app=${p[0]}

            echo "$app" | grep -qiE "^($EXCLUDED)$" && continue

            cluster=$(grep -iE "kubeContext:|context:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")

            [[ -z "$cluster" ]] && continue
            echo "$cluster" | grep -q "UPDATE_ME" && continue

            grep -qx "$cluster" aks_clusters.txt || continue

            namespace=$(grep -E "^[[:space:]]*namespace:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs)

            [[ -z "$namespace" || "$namespace" == *"{{"* ]] && namespace="$app"

            printf "%-35s %-25s %-25s\n" "$cluster" "$namespace" "$app"
            
            # Save to file for later comparison
            echo "$cluster|$namespace|$app" >> helmfile_data.txt

          done

      # =========================
      # AKS OUTPUT (Save to file)
      # =========================
      - name: Print AKS Data
        run: |
          echo ""
          echo "================ AKS DATA ================="

          printf "%-35s %-25s %-25s\n" \
          "Cluster Name" "Namespace" "Deployed App"

          printf "%-35s %-25s %-25s\n" \
          "============" "=========" "============="

          EXCLUDED="trident|tailscale|velero|mtls-outbound|default"

          export KUBECONFIG=/tmp/kubeconfig
          
          # Save to file for comparison
          > aks_data.txt

          while read cluster; do

            echo "Processing $cluster"

            rg=$(az aks list --query "[?name=='$cluster'].resourceGroup" -o tsv)

            az aks get-credentials -g "$rg" -n "$cluster" --overwrite-existing >/dev/null 2>&1

            kubectl get ns >/dev/null 2>&1 || continue

            kubectl get ns --no-headers | awk '{print $1}' \
            | grep -vE "^(default|kube-|calico|tigera|gatekeeper|trident|aks-command)" \
            | while read ns; do

              kubectl get deploy -n "$ns" --no-headers 2>/dev/null \
              | awk '{print $1}' \
              | grep -viE "^($EXCLUDED)$" \
              | while read d; do
                  printf "%-35s %-25s %-25s\n" "$cluster" "$ns" "$d"
                  # Save to file for later comparison
                  echo "$cluster|$ns|$d" >> aks_data.txt
                done

            done

          done < aks_clusters.txt

      # =========================
      # COMPARE HELMFILE DATA vs AKS DATA
      # =========================
      - name: Compare and Generate Final Table
        run: |
          echo ""
          echo "================ COMPARISON RESULTS ================="
          echo ""

          printf "%-35s %-25s %-35s %-10s\n" \
          "Cluster Name" "Namespace" "Application" "Deployed Y/N"

          printf "%-35s %-25s %-35s %-10s\n" \
          "============" "==========" "===================" "=============="

          # Check if files exist
          if [ ! -f helmfile_data.txt ]; then
            echo "ERROR: helmfile_data.txt not found"
            exit 1
          fi
          
          if [ ! -f aks_data.txt ]; then
            echo "ERROR: aks_data.txt not found"
            exit 1
          fi

          # Create normalized AKS data for better matching
          > aks_normalized.txt
          while IFS='|' read cluster ns app; do
            # Store original
            echo "$cluster|$ns|$app" >> aks_normalized.txt
            # Store lowercase version
            echo "$cluster|$ns|$app" | tr '[:upper:]' '[:lower:]' >> aks_normalized.txt
            # Store without special characters
            cluster_clean=$(echo "$cluster" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
            ns_clean=$(echo "$ns" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
            app_clean=$(echo "$app" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
            echo "$cluster_clean|$ns_clean|$app_clean" >> aks_normalized.txt
          done < aks_data.txt
          
          # Sort and unique
          sort -u aks_normalized.txt -o aks_normalized.txt

          # Compare each helmfile entry with AKS data
          > final_results.txt
          total=0
          deployed=0

          while IFS='|' read helm_cluster helm_ns helm_app; do
            total=$((total + 1))
            matched="N"
            
            # Create normalized versions for helmfile app
            helm_cluster_lower=$(echo "$helm_cluster" | tr '[:upper:]' '[:lower:]')
            helm_ns_lower=$(echo "$helm_ns" | tr '[:upper:]' '[:lower:]')
            helm_app_lower=$(echo "$helm_app" | tr '[:upper:]' '[:lower:]')
            
            helm_cluster_clean=$(echo "$helm_cluster" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
            helm_ns_clean=$(echo "$helm_ns" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
            helm_app_clean=$(echo "$helm_app" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
            
            # Strategy 1: Exact match
            if grep -q "^$helm_cluster|$helm_ns|$helm_app$" aks_data.txt 2>/dev/null; then
              matched="Y"
              deployed=$((deployed + 1))
            fi
            
            # Strategy 2: Case-insensitive match
            if [ "$matched" = "N" ]; then
              if grep -qi "^$helm_cluster_lower|$helm_ns_lower|$helm_app_lower$" aks_data.txt 2>/dev/null; then
                matched="Y"
                deployed=$((deployed + 1))
              fi
            fi
            
            # Strategy 3: Clean match (no special chars)
            if [ "$matched" = "N" ]; then
              if grep -q "^$helm_cluster_clean|$helm_ns_clean|$helm_app_clean$" aks_normalized.txt 2>/dev/null; then
                matched="Y"
                deployed=$((deployed + 1))
              fi
            fi
            
            # Strategy 4: Partial match in same namespace
            if [ "$matched" = "N" ]; then
              # Check if any deployment in same namespace has similar name
              if grep -q "^$helm_cluster|$helm_ns|" aks_data.txt 2>/dev/null; then
                while IFS='|' read aks_cluster aks_ns aks_app; do
                  aks_app_clean=$(echo "$aks_app" | tr '[:upper:]' '[:lower:]' | sed 's/[-_]//g')
                  if [[ "$aks_app_clean" == *"$helm_app_clean"* ]] || [[ "$helm_app_clean" == *"$aks_app_clean"* ]]; then
                    matched="Y"
                    deployed=$((deployed + 1))
                    break
                  fi
                done < <(grep "^$helm_cluster|$helm_ns|" aks_data.txt)
              fi
            fi
            
            # Strategy 5: App exists in any namespace in the same cluster
            if [ "$matched" = "N" ]; then
              if grep -q "^$helm_cluster|.*|$helm_app$" aks_data.txt 2>/dev/null; then
                matched="Y"
                deployed=$((deployed + 1))
              elif grep -qi "^$helm_cluster_lower|.*|$helm_app_lower$" aks_data.txt 2>/dev/null; then
                matched="Y"
                deployed=$((deployed + 1))
              fi
            fi
            
            # Store result
            echo "$helm_cluster|$helm_ns|$helm_app|$matched" >> final_results.txt
            
            # Display in table format
            if [ "$matched" = "Y" ]; then
              printf "%-35s %-25s %-35s %-10s\n" "$helm_cluster" "$helm_ns" "$helm_app" "YES"
            else
              printf "%-35s %-25s %-35s %-10s\n" "$helm_cluster" "$helm_ns" "$helm_app" "NO"
            fi
            
          done < helmfile_data.txt

          echo ""
          echo "=============================================================="
          echo ""
          echo "STATISTICS:"
          echo "  Total helmfile applications: $total"
          echo "  Deployed in AKS: $deployed"
          echo "  Not deployed: $((total - deployed))"
          
          if [ $total -gt 0 ]; then
            percentage=$(echo "scale=2; $deployed * 100 / $total" | bc)
            echo "  Coverage: ${percentage}%"
          fi
          echo ""

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-reports
          path: |
            helmfile_data.txt
            aks_data.txt
            final_results.txt
          retention-days: 7
