name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # STEP 1: GET ALL APPS FROM /apps DIR
      # =========================
      - name: Get all apps from /apps directory
        run: |
          echo "=============================================="
          echo "STEP 1: ALL APPLICATIONS IN /apps DIRECTORY"
          echo "=============================================="
          echo ""
          
          if [ ! -d "apps" ]; then
            echo "❌ ERROR: 'apps' directory not found!"
            exit 1
          fi
          
          # List all app directories (exclude excluded ones)
          EXCLUDED_APPS="mtls-outbound|tailscale|velero|bin|examples"
          
          echo "Application directories found:"
          for app in apps/*/; do
            app_name=$(basename "$app")
            if ! echo "$app_name" | grep -qE "^($EXCLUDED_APPS)$"; then
              echo "  ✅ $app_name"
            else
              echo "  ⏭️  $app_name (excluded)"
            fi
          done
          echo ""

      # =========================
      # STEP 2: CHECK ALL HELMFILE FILES
      # =========================
      - name: Check all helmfile files
        run: |
          echo "=============================================="
          echo "STEP 2: HELMFILE APPLICATIONS"
          echo "=============================================="
          echo ""
          
          # Create helmfile CSV
          echo "Cluster,Application,Namespace,Helmfile_Path" > helmfile.csv
          
          EXCLUDED_APPS="mtls-outbound|tailscale|velero|bin|examples"
          
          find apps -type f \( -name "helmfile.yaml" -o -name "helmfile.yml" \) 2>/dev/null | while read file; do
            rel_path=${file#apps/}
            IFS='/' read -ra parts <<< "$rel_path"
            
            app_name=${parts[0]}
            
            # Skip excluded apps
            if echo "$app_name" | grep -qE "^($EXCLUDED_APPS)$"; then
              continue
            fi
            
            # Get cluster from path
            if [ ${#parts[@]} -ge 2 ]; then
              cluster_name=${parts[1]}
            else
              cluster_name="unknown"
            fi
            
            # Extract namespace
            namespace=""
            if [ -f "$file" ]; then
              namespace=$(grep -E "^[[:space:]]*namespace:" "$file" | head -1 | sed 's/.*namespace:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
              
              if [[ -z "$namespace" ]] || [[ "$namespace" == *"{{"* ]]; then
                values_file=$(dirname "$file")/values.yaml
                if [ -f "$values_file" ]; then
                  namespace=$(grep -E "^[[:space:]]*namespace:" "$values_file" | head -1 | sed 's/.*namespace:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
                fi
              fi
              
              if [[ -z "$namespace" ]] || [[ "$namespace" == *"{{"* ]]; then
                namespace="$app_name"
              fi
            fi
            
            # Check for cluster override
            raw_cluster=$(grep -iE "kubeContext:|context:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")
            
            if [[ -n "$raw_cluster" && "$raw_cluster" != *"{{"* ]]; then
              final_cluster="$raw_cluster"
            else
              final_cluster="$cluster_name"
            fi
            
            echo "$final_cluster,$app_name,$namespace,$file" >> helmfile.csv
          done
          
          # Remove duplicates
          sort -u helmfile.csv -o helmfile.csv
          
          echo "Helmfile applications found:"
          tail -n +2 helmfile.csv | while IFS=',' read -r cluster app ns path; do
            echo "  📦 $app | Cluster: $cluster | Namespace: $ns"
          done
          
          APP_COUNT=$(tail -n +2 helmfile.csv 2>/dev/null | wc -l)
          CLUSTER_COUNT=$(tail -n +2 helmfile.csv 2>/dev/null | cut -d',' -f1 | sort -u | wc -l)
          
          echo ""
          echo "Total Helmfile Applications: $APP_COUNT"
          echo "Total Helmfile Clusters: $CLUSTER_COUNT"
          echo ""
          
          echo "HELMFILE_APP_COUNT=$APP_COUNT" >> $GITHUB_ENV
          echo "HELMFILE_CLUSTER_COUNT=$CLUSTER_COUNT" >> $GITHUB_ENV

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # =========================
      # AZURE LOGIN
      # =========================
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # =========================
      # STEP 3: CHECK ALL AKS CLUSTERS
      # =========================
      - name: Check all AKS clusters
        run: |
          echo ""
          echo "=============================================="
          echo "STEP 3: ALL AKS CLUSTERS"
          echo "=============================================="
          echo ""
          
          echo "Cluster,ResourceGroup,Location,Version" > aks_clusters.csv
          
          az aks list --query "[].{name:name,rg:resourceGroup,location:location,version:kubernetesVersion}" -o tsv | while read name rg location version; do
            echo "$name,$rg,$location,$version" >> aks_clusters.csv
            echo "  ☸️  $name | $location | $version"
          done
          
          AKS_CLUSTER_COUNT=$(tail -n +2 aks_clusters.csv 2>/dev/null | wc -l)
          echo ""
          echo "Total AKS Clusters: $AKS_CLUSTER_COUNT"
          echo ""
          
          echo "AKS_CLUSTER_COUNT=$AKS_CLUSTER_COUNT" >> $GITHUB_ENV

      # =========================
      # STEP 4: CHECK ALL NAMESPACES UNDER EACH AKS CLUSTER
      # =========================
      - name: Check all namespaces under each AKS cluster
        run: |
          echo ""
          echo "=============================================="
          echo "STEP 4: NAMESPACES UNDER EACH AKS CLUSTER"
          echo "=============================================="
          echo ""
          
          export KUBECONFIG=/tmp/kubeconfig
          
          echo "Cluster,Namespace" > aks_namespaces.csv
          
          # System namespaces to exclude
          SYSTEM_NS="^(default|kube-system|kube-public|kube-node-lease|calico-system|gatekeeper-system|tigera-operator|trident|aks-command|azure-)"
          
          az aks list --query "[].{name:name,rg:resourceGroup}" -o tsv | while read cluster rg; do
            echo "Processing cluster: $cluster"
            
            if az aks get-credentials --resource-group "$rg" --name "$cluster" --overwrite-existing >/dev/null 2>&1; then
              ns_count=0
              kubectl get ns --no-headers 2>/dev/null | awk '{print $1}' | grep -vE "$SYSTEM_NS" | while read ns; do
                if [ -n "$ns" ]; then
                  echo "$cluster,$ns" >> aks_namespaces.csv
                  echo "  📁 $ns"
                  ns_count=$((ns_count + 1))
                fi
              done
              echo "  Total namespaces: $ns_count"
            else
              echo "  ❌ Failed to connect"
            fi
            echo ""
          done
          
          AKS_NS_COUNT=$(tail -n +2 aks_namespaces.csv 2>/dev/null | wc -l)
          echo "Total AKS Namespaces (excluding system): $AKS_NS_COUNT"
          echo ""
          
          echo "AKS_NS_COUNT=$AKS_NS_COUNT" >> $GITHUB_ENV

      # =========================
      # STEP 5: GET READY BOTH LISTS (HELMFILE AND AKS)
      # =========================
      - name: Prepare both lists
        run: |
          echo ""
          echo "=============================================="
          echo "STEP 5: HELMFILE VS AKS - READY FOR COMPARISON"
          echo "=============================================="
          echo ""
          
          echo "=== HELMFILE LIST ==="
          echo "Format: Cluster, Application, Namespace"
          tail -n +2 helmfile.csv | head -10
          echo "..."
          echo ""
          
          echo "=== AKS LIST ==="
          echo "Format: Cluster, Namespace"
          tail -n +2 aks_namespaces.csv | head -10
          echo "..."
          echo ""

      # =========================
      # STEP 6: PRINT COMPARE LIST IN TABULAR FORMAT
      # =========================
      - name: Print compare list in tabular format
        run: |
          echo ""
          echo "=============================================="
          echo "STEP 6: COMPARISON - HELMFILE vs AKS"
          echo "=============================================="
          echo ""
          
          # Create AKS namespace lookup
          declare -A aks_lookup
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ] && [ -n "$ns" ]; then
              key="${cluster}|${ns}"
              aks_lookup["$key"]=1
            fi
          done < aks_namespaces.csv
          
          echo "DEPLOYMENT STATUS:"
          echo "-----------------"
          printf "%-45s %-35s %-35s %-12s\n" "CLUSTER NAME" "NAMESPACE" "APPLICATION" "DEPLOYED"
          printf "%-45s %-35s %-35s %-12s\n" "============" "=========" "===========" "========"
          
          prev_cluster=""
          deployed=0
          not_deployed=0
          
          tail -n +2 helmfile.csv | sort -t',' -k1,1 -k3,3 | while IFS=',' read -r cluster app namespace path; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            if [ -z "$cluster" ] || [ -z "$app" ] || [ -z "$namespace" ]; then
              continue
            fi
            
            key="${cluster}|${namespace}"
            if [[ -n "${aks_lookup[$key]}" ]]; then
              status="✅ DEPLOYED"
              deployed=$((deployed + 1))
            else
              status="❌ NOT DEPLOYED"
              not_deployed=$((not_deployed + 1))
            fi
            
            if [ "$cluster" != "$prev_cluster" ]; then
              printf "%-45s %-35s %-35s %-12s\n" "$cluster" "$namespace" "$app" "$status"
              prev_cluster="$cluster"
            else
              printf "%-45s %-35s %-35s %-12s\n" "" "$namespace" "$app" "$status"
            fi
          done
          
          echo "DEPLOYED_COUNT=$deployed" >> $GITHUB_ENV
          echo "NOT_DEPLOYED_COUNT=$not_deployed" >> $GITHUB_ENV
          echo ""

      # =========================
      # STEP 7: PRINT FINAL LIST - APPS DEPLOYED ON EVERY NAMESPACE
      # =========================
      - name: Print final list - deployed applications
        run: |
          echo ""
          echo "=============================================="
          echo "STEP 7: DEPLOYED APPLICATIONS ON AKS CLUSTERS"
          echo "=============================================="
          echo ""
          
          # Create AKS namespace lookup
          declare -A aks_lookup
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ] && [ -n "$ns" ]; then
              key="${cluster}|${ns}"
              aks_lookup["$key"]=1
            fi
          done < aks_namespaces.csv
          
          echo "DEPLOYED APPLICATIONS:"
          echo "---------------------"
          printf "%-45s %-35s %-35s\n" "CLUSTER NAME" "NAMESPACE" "APPLICATION"
          printf "%-45s %-35s %-35s\n" "============" "=========" "==========="
          
          deployed_found=false
          
          tail -n +2 helmfile.csv | sort -t',' -k1,1 -k3,3 | while IFS=',' read -r cluster app namespace path; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            if [ -z "$cluster" ] || [ -z "$app" ] || [ -z "$namespace" ]; then
              continue
            fi
            
            key="${cluster}|${namespace}"
            if [[ -n "${aks_lookup[$key]}" ]]; then
              printf "%-45s %-35s %-35s\n" "$cluster" "$namespace" "$app"
              deployed_found=true
            fi
          done
          
          if [ "$deployed_found" = false ]; then
            echo "No deployed applications found"
          fi
          
          echo ""
          echo "=============================================="
          echo "NOT DEPLOYED APPLICATIONS:"
          echo "-------------------------"
          printf "%-45s %-35s %-35s\n" "CLUSTER NAME" "NAMESPACE" "APPLICATION"
          printf "%-45s %-35s %-35s\n" "============" "=========" "==========="
          
          not_deployed_found=false
          
          tail -n +2 helmfile.csv | sort -t',' -k1,1 -k3,3 | while IFS=',' read -r cluster app namespace path; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            if [ -z "$cluster" ] || [ -z "$app" ] || [ -z "$namespace" ]; then
              continue
            fi
            
            key="${cluster}|${namespace}"
            if [[ -z "${aks_lookup[$key]}" ]]; then
              printf "%-45s %-35s %-35s\n" "$cluster" "$namespace" "$app"
              not_deployed_found=true
            fi
          done
          
          if [ "$not_deployed_found" = false ]; then
            echo "All applications are deployed!"
          fi
          echo ""

      # =========================
      # STEP 8: PRINT SUMMARY WITH COUNTS AT THE TOP
      # =========================
      - name: Print summary with counts
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════════════════════╗"
          echo "║                              SUMMARY STATISTICS                                 ║"
          echo "╠════════════════════════════════════════════════════════════════════════════════╣"
          echo "║                                                                                ║"
          printf "║  %-35s : %-45s ║\n" "📊 Helmfile Applications" "${{ env.HELMFILE_APP_COUNT }}"
          printf "║  %-35s : %-45s ║\n" "📊 Helmfile Clusters" "${{ env.HELMFILE_CLUSTER_COUNT }}"
          echo "║                                                                                ║"
          printf "║  %-35s : %-45s ║\n" "☸️  AKS Clusters" "${{ env.AKS_CLUSTER_COUNT }}"
          printf "║  %-35s : %-45s ║\n" "📁 AKS Namespaces (Application)" "${{ env.AKS_NS_COUNT }}"
          echo "║                                                                                ║"
          printf "║  %-35s : %-45s ║\n" "✅ Deployed Applications" "${{ env.DEPLOYED_COUNT }}"
          printf "║  %-35s : %-45s ║\n" "❌ Not Deployed Applications" "${{ env.NOT_DEPLOYED_COUNT }}"
          echo "║                                                                                ║"
          TOTAL_APPS=${{ env.HELMFILE_APP_COUNT }}
          DEPLOYED=${{ env.DEPLOYED_COUNT }}
          if [ "$TOTAL_APPS" -gt 0 ]; then
            COVERAGE=$(echo "scale=2; $DEPLOYED * 100 / $TOTAL_APPS" | bc)
            printf "║  %-35s : %-45s ║\n" "📈 Deployment Coverage" "${COVERAGE}%"
          fi
          echo "╚════════════════════════════════════════════════════════════════════════════════╝"
          echo ""

      # =========================
      # UPLOAD REPORTS
      # =========================
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-deployment-reports
          path: |
            helmfile.csv
            aks_clusters.csv
            aks_namespaces.csv
          retention-days: 14

      # =========================
      # CREATE GITHUB SUMMARY
      # =========================
      - name: Create GitHub Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📊 Cluster Deployment Summary
          
          ### 📈 Statistics
          
          | Metric | Value |
          |--------|-------|
          | **Helmfile Applications** | ${{ env.HELMFILE_APP_COUNT }} |
          | **Helmfile Clusters** | ${{ env.HELMFILE_CLUSTER_COUNT }} |
          | **AKS Clusters** | ${{ env.AKS_CLUSTER_COUNT }} |
          | **AKS Namespaces (Application)** | ${{ env.AKS_NS_COUNT }} |
          | **Deployed Applications** | ${{ env.DEPLOYED_COUNT }} ✅ |
          | **Not Deployed Applications** | ${{ env.NOT_DEPLOYED_COUNT }} ❌ |
          
          ### 📋 Deployment Details
          
          | Cluster Name | Namespace | Application | Status |
          |--------------|-----------|-------------|--------|
          EOF
          
          # Create AKS lookup for summary
          declare -A aks_lookup_summary
          while IFS=',' read -r cluster ns; do
            if [ "$cluster" != "Cluster" ]; then
              aks_lookup_summary["${cluster}|${ns}"]=1
            fi
          done < aks_namespaces.csv
          
          # Add table rows
          tail -n +2 helmfile.csv | sort | while IFS=',' read -r cluster app namespace path; do
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            if [ -z "$cluster" ] || [ -z "$app" ] || [ -z "$namespace" ]; then
              continue
            fi
            
            key="${cluster}|${namespace}"
            if [[ -n "${aks_lookup_summary[$key]}" ]]; then
              status="✅ Deployed"
            else
              status="❌ Not Deployed"
            fi
            
            echo "| $cluster | $namespace | $app | $status |" >> $GITHUB_STEP_SUMMARY
          done
