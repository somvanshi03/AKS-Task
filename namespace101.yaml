name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # HELMFILE (FIXED)
      # =========================
      - name: Generate Helmfile CSV
        run: |
          echo "Cluster,Application,Namespace" > helmfile.csv

          find apps -type f \( -name "helmfile.yaml" -o -name "helmfile.yml" \) 2>/dev/null | while read file; do

            rel_path=${file#apps/}
            IFS='/' read -ra parts <<< "$rel_path"

            app=${parts[0]}
            cluster=${parts[1]}

            # ❌ EXCLUDE APPS (system apps)
            case "$app" in
              default|trident|tailscale|mtls-outbound|velero|calico|gatekeeper|tigera|ingress-nginx|monitoring)
                echo "Skipping system app: $app" >&2
                continue
                ;;
            esac

            # ✅ HANDLE BOTH STRUCTURES
            if [ "${#parts[@]}" -ge 4 ]; then
              namespace=${parts[2]}
            else
              # Try to get namespace from helmfile
              namespace=$(grep -i "^namespace:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

              # If namespace is templated or empty, use app name
              if [[ -z "$namespace" || "$namespace" == *"{{"* ]]; then
                namespace="$app"
              fi
            fi

            # Cluster override
            raw_cluster=$(grep -iE "kubeContext:|context:" "$file" | head -1 | awk -F ':' '{print $2}' | xargs)

            if [[ -n "$raw_cluster" && "$raw_cluster" != *"{{"* ]]; then
              final_cluster="$raw_cluster"
            else
              final_cluster="$cluster"
            fi

            # Skip invalid
            if [[ "$final_cluster" == *"UPDATE"* ]]; then
              continue
            fi

            echo "$final_cluster,$app,$namespace" >> helmfile.csv
          done
          
          echo "=== HELMFILE.CSV ==="
          cat helmfile.csv
          echo "==================="

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # =========================
      # AZURE LOGIN
      # =========================
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # =========================
      # AKS DATA (FIXED - BASED ON YOUR ACTUAL DATA)
      # =========================
      - name: Generate AKS CSV
        run: |
          set +e
          export KUBECONFIG=/tmp/kubeconfig

          echo "Cluster,Namespace,Version" > aks.csv

          az aks list \
            --query "[].{name:name,rg:resourceGroup,version:kubernetesVersion}" \
            -o tsv | while read cluster rg version; do

            echo "Processing $cluster"

            # Get credentials
            az aks get-credentials \
              --resource-group "$rg" \
              --name "$cluster" \
              --overwrite-existing >/dev/null 2>&1

            # Get namespaces
            namespaces=$(kubectl get ns --no-headers 2>/dev/null | awk '{print $1}')
            
            # ❌ unreachable cluster
            if [ -z "$namespaces" ]; then
              echo "$cluster,UNREACHABLE,$version" >> aks.csv
              continue
            fi

            # ✅ ONLY EXCLUDE SYSTEM NAMESPACES (based on your actual output)
            # From your kubectl output, these are system namespaces to exclude:
            # aks-command, calico-system, default, gatekeeper-system, 
            # kube-node-lease, kube-public, kube-system, tigera-operator, trident
            echo "$namespaces" | grep -vE "aks-command|calico-system|default|gatekeeper-system|kube-node-lease|kube-public|kube-system|tigera-operator|trident" | while read ns; do
              if [ -n "$ns" ]; then
                echo "$cluster,$ns,$version" >> aks.csv
                echo "  Found namespace: $ns" >&2
              fi
            done

          done
          
          echo "=== AKS.CSV (from your cluster) ==="
          cat aks.csv
          echo "==================================="

      # =========================
      # COMPARE (FIXED - MATCH BY NAMESPACE)
      # =========================
      - name: Compare Deployment Status
        run: |
          echo "Cluster,Namespace,Application,Deployed,AKS_Namespace_Match" > comparison.csv
          
          # Create lookup file for AKS namespaces
          tail -n +2 aks.csv | while IFS=',' read -r cluster namespace version; do
            echo "${cluster}|${namespace}" >> aks_namespaces.txt
          done
          
          # Process helmfile entries
          tail -n +2 helmfile.csv | while IFS=',' read -r cluster app namespace; do
            # Trim whitespace
            cluster=$(echo "$cluster" | xargs)
            app=$(echo "$app" | xargs)
            namespace=$(echo "$namespace" | xargs)
            
            # Check if namespace exists in AKS for this cluster
            found="N"
            match_ns=""
            
            if grep -q "^${cluster}|${namespace}$" aks_namespaces.txt 2>/dev/null; then
              found="Y"
              match_ns="$namespace"
            else
              # Try case-insensitive match
              if grep -qi "^${cluster}|${namespace}$" aks_namespaces.txt 2>/dev/null; then
                found="Y"
                match_ns=$(grep -i "^${cluster}|${namespace}$" aks_namespaces.txt | cut -d'|' -f2)
              fi
            fi
            
            echo "$cluster,$namespace,$app,$found,$match_ns" >> comparison.csv
          done
          
          echo "=== COMPARISON.CSV ==="
          cat comparison.csv
          echo "====================="

      # =========================
      # FINAL OUTPUT (BASED ON YOUR CLUSTER)
      # =========================
      - name: Final Combined Output
        run: |
          echo ""
          echo "=============================================================="
          echo "CLUSTER: aks-scp-dev-itn-st-cms"
          echo "=============================================================="
          echo ""

          echo "=== NAMESPACES FROM AKS (YOUR ACTUAL CLUSTER) ==="
          echo ""
          echo "From your manual kubectl get ns output:"
          echo "  common-res      - Active"
          echo "  dr-app-test     - Active"
          echo "  ingress-nginx   - Active"
          echo "  nr-bal          - Active"
          echo "  nr-cms          - Active"
          echo "  nr-demo         - Active"
          echo "  nr-infra-common - Active"
          echo "  nr-monitoring   - Active"
          echo ""

          echo "=== HELMFILE APPLICATIONS vs AKS NAMESPACES ==="
          echo ""
          printf "%-35s %-35s %-35s %-10s\n" "Application" "Expected Namespace" "AKS Namespace" "Status"
          printf "%-35s %-35s %-35s %-10s\n" "===========" "=================" "=============" "======"
          
          tail -n +2 comparison.csv | sort | while IFS=',' read -r cluster namespace app deployed aks_ns; do
            if [ "$deployed" == "Y" ]; then
              status="✅ DEPLOYED"
              # Color coding for deployed
              printf "\033[0;32m%-35s\033[0m \033[0;32m%-35s\033[0m \033[0;32m%-35s\033[0m \033[0;32m%-10s\033[0m\n" "$app" "$namespace" "$aks_ns" "$status"
            else
              status="❌ NOT DEPLOYED"
              printf "\033[0;31m%-35s\033[0m \033[0;31m%-35s\033[0m \033[0;31m%-35s\033[0m \033[0;31m%-10s\033[0m\n" "$app" "$namespace" "$aks_ns" "$status"
            fi
          done
          
          echo ""
          echo "=== SUMMARY ==="
          echo ""
          total_apps=$(tail -n +2 helmfile.csv 2>/dev/null | wc -l)
          deployed=$(grep ",Y," comparison.csv 2>/dev/null | wc -l)
          not_deployed=$(grep ",N," comparison.csv 2>/dev/null | wc -l)
          
          echo "Total Helmfile Applications: $total_apps"
          echo "Deployed: $deployed"
          echo "Not Deployed: $not_deployed"
          
          if [ $not_deployed -gt 0 ]; then
            echo ""
            echo "=== NOT DEPLOYED APPLICATIONS ==="
            echo ""
            grep ",N," comparison.csv | while IFS=',' read -r cluster namespace app deployed aks_ns; do
              echo "  • $app - Expected namespace: $namespace"
            done
          fi

      # =========================
      # UPLOAD REPORTS
      # =========================
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-deployment-reports
          path: |
            helmfile.csv
            aks.csv
            comparison.csv
          retention-days: 14
