name: Cluster details from repo

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  cluster-details:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # INSTALL + LOGIN
      # =========================
      - name: Install Azure CLI + kubectl
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_SP_ID }}" \
            --password "${{ secrets.AZURE_SP_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

      # =========================
      # FETCH AKS CLUSTERS
      # =========================
      - name: Fetch AKS clusters
        run: |
          az aks list --query "[].name" -o tsv | sort > aks_clusters.txt
          echo "Total AKS clusters found: $(wc -l < aks_clusters.txt)"

      # =========================
      # COLLECT HELMFILE DATA
      # =========================
      - name: Collect Helmfile Data
        run: |
          echo "Collecting helmfile applications..."
          > helmfile_data.txt

          EXCLUDED="trident|tailscale|velero|mtls-outbound|default|datadog"
          STATIC_NS_APPS="common-res|edb-common-res"

          find apps -type f -name "helmfile.yaml" | while read file; do
            rel=${file#apps/}
            IFS='/' read -ra p <<< "$rel"
            app=${p[0]}
            instance=${p[1]}

            echo "$app" | grep -qiE "^($EXCLUDED)$" && continue
            echo "$instance" | grep -qi "template" && continue

            cluster=$(grep -iE "kubeContext:" "$file" \
              | head -1 | awk -F ':' '{print $2}' | xargs | tr -d '"' | tr -d "'")

            [[ -z "$cluster" ]] && continue
            echo "$cluster" | grep -q "UPDATE_ME" && continue

            if echo "$app" | grep -qiE "^($STATIC_NS_APPS)$"; then
              namespace="common-res"
            else
              if grep -q 'trimSuffix.*-dr' "$file" 2>/dev/null; then
                namespace="${instance%-dr}"
              else
                namespace="$instance"
              fi
            fi

            if grep -qxF "$cluster" aks_clusters.txt; then
              in_aks="Y"
            else
              in_aks="N"
            fi

            echo "$cluster|$namespace|$instance|$app|$in_aks" >> helmfile_data.txt
          done

          sort -t'|' -k1,1 -k2,2 -u helmfile_data.txt -o helmfile_data.txt

          total=$(wc -l < helmfile_data.txt)
          in_aks=$(grep -c '|Y$' helmfile_data.txt || true)
          not_in_aks=$(grep -c '|N$' helmfile_data.txt || true)
          echo "Total helmfile instances  : $total"
          echo "  Cluster in AKS          : $in_aks"
          echo "  Cluster NOT in AKS      : $not_in_aks"

      # =========================
      # BUILD AKS CACHE
      # =========================
      - name: Build AKS Cache
        run: |
          echo "Building AKS deployment cache..."
          export KUBECONFIG=/tmp/kubeconfig
          > aks_data.txt
          > aks_namespaces.txt
          > unreachable_clusters.txt
          UNREACHABLE=0

          EXCLUDED_NS="^(default|kube-.*|calico.*|tigera.*|gatekeeper.*|trident.*|aks-command.*)"
          EXCLUDED_APPS="trident|tailscale|velero|mtls-outbound|datadog|ingress-nginx|cert-manager|konnectivity|azure-cni|calico|gatekeeper|tigera"

          while read cluster; do
            rg=$(az aks list --query "[?name=='$cluster'].resourceGroup" -o tsv)

            if [[ -z "$rg" ]]; then
              echo "  WARNING: No resource group found for $cluster — skipping"
              echo "$cluster" >> unreachable_clusters.txt
              UNREACHABLE=$((UNREACHABLE + 1))
              continue
            fi

            az aks get-credentials -g "$rg" -n "$cluster" --overwrite-existing >/dev/null 2>&1

            if ! kubectl get ns >/dev/null 2>&1; then
              echo "  WARNING: Cannot reach $cluster — skipping"
              echo "$cluster" >> unreachable_clusters.txt
              UNREACHABLE=$((UNREACHABLE + 1))
              continue
            fi

            kubectl get ns --no-headers 2>/dev/null | awk '{print $1}' \
            | grep -vE "$EXCLUDED_NS" \
            | while read ns; do
                echo "$cluster|$ns" >> aks_namespaces.txt
                kubectl get deploy -n "$ns" --no-headers 2>/dev/null \
                | awk '{print $1}' \
                | grep -viE "^($EXCLUDED_APPS)$" \
                | while read d; do
                    echo "$cluster|$ns|$d" >> aks_data.txt
                  done
              done

          done < aks_clusters.txt

          sort -u aks_data.txt -o aks_data.txt
          sort -u aks_namespaces.txt -o aks_namespaces.txt
          echo "UNREACHABLE=$UNREACHABLE" >> "$GITHUB_ENV"
          echo "Total AKS deployments cached: $(wc -l < aks_data.txt)"
          echo "Unreachable clusters        : $UNREACHABLE"

      # =========================
      # DISPLAY HELMFILE DATA
      # =========================
      - name: Display Helmfile Data
        run: |
          echo ""
          echo "================ HELMFILE DATA ================="
          printf "%-35s %-30s %-30s %-20s %-10s\n" \
            "Cluster" "Namespace (AKS)" "Instance" "App Type" "In AKS"
          printf "%-35s %-30s %-30s %-20s %-10s\n" \
            "=======" "===============" "========" "========" "======"

          while IFS='|' read cluster ns instance app in_aks; do
            [[ "$in_aks" == "Y" ]] && flag="YES" || flag="NO"
            printf "%-35s %-30s %-30s %-20s %-10s\n" \
              "$cluster" "$ns" "$instance" "$app" "$flag"
          done < helmfile_data.txt

      # =========================
      # DISPLAY AKS DATA
      # =========================
      - name: Display AKS Data
        run: |
          echo ""
          echo "================ AKS DATA ================="
          printf "%-35s %-30s %-30s\n" "Cluster Name" "Namespace" "Deployed App"
          printf "%-35s %-30s %-30s\n" "============" "=========" "============"

          if [[ -s aks_data.txt ]]; then
            while IFS='|' read cluster ns app; do
              printf "%-35s %-30s %-30s\n" "$cluster" "$ns" "$app"
            done < aks_data.txt
          else
            echo "No AKS deployments found."
          fi

      # =========================
      # SUMMARY
      # =========================
      - name: Print Summary
        run: |
          echo ""
          echo "========================= SUMMARY ============================"

          HELM_CLUSTER_COUNT=$(cut -d'|' -f1 helmfile_data.txt | sort -u | wc -l)
          HELM_APP_COUNT=$(wc -l < helmfile_data.txt)
          HELM_IN_AKS=$(grep -c '|Y$' helmfile_data.txt || true)
          HELM_NOT_IN_AKS=$(grep -c '|N$' helmfile_data.txt || true)

          AKS_CLUSTER_COUNT=$(wc -l < aks_clusters.txt)
          AKS_NS_COUNT=$(wc -l < aks_namespaces.txt)
          AKS_DEPLOY_COUNT=$(wc -l < aks_data.txt)

          echo ""
          echo "  Helmfile clusters              : $HELM_CLUSTER_COUNT"
          echo "  Helmfile instances (total)     : $HELM_APP_COUNT"
          echo "  Helmfile instances (in AKS)    : $HELM_IN_AKS"
          echo "  Helmfile instances (not in AKS): $HELM_NOT_IN_AKS"
          echo ""
          echo "  AKS clusters (total)           : $AKS_CLUSTER_COUNT"
          echo "  AKS namespaces                 : $AKS_NS_COUNT"
          echo "  AKS deployments                : $AKS_DEPLOY_COUNT"
          echo "  Unreachable clusters           : $UNREACHABLE"
          echo "=============================================================="

      # =========================
      # COMPARE AND GENERATE FINAL TABLE
      # =========================
      - name: Compare and Generate Final Table
        run: |
          echo ""
          echo "================ CLUSTER DETAILS ================="
          printf "%-35s %-30s %-20s %-20s\n" \
            "Cluster" "Instance" "App Type" "Status"
          printf "%-35s %-30s %-20s %-20s\n" \
            "=======" "========" "========" "======"

          if [[ ! -s aks_data.txt ]]; then
            echo "WARNING: No AKS data available — all apps will show as NO"
            echo ""
          fi

          total=0
          count_yes=0
          count_no=0
          count_not_found=0
          count_unreachable=0
          prev_cluster=""

          while IFS='|' read helm_cluster helm_ns helm_instance helm_app in_aks; do
            total=$((total + 1))
            status="NO"

            if [[ "$in_aks" == "N" ]]; then
              status="CLUSTER-NOT-FOUND"
              count_not_found=$((count_not_found + 1))

            elif grep -qxF "$helm_cluster" unreachable_clusters.txt 2>/dev/null; then
              status="UNREACHABLE"
              count_unreachable=$((count_unreachable + 1))

            else
              if grep -qxF "$helm_cluster|$helm_ns" aks_namespaces.txt 2>/dev/null; then
                status="YES"
              elif grep -qxF "$helm_cluster|$helm_ns|$helm_instance" aks_data.txt 2>/dev/null; then
                status="YES"
              fi

              if [[ "$status" == "YES" ]]; then
                count_yes=$((count_yes + 1))
              else
                count_no=$((count_no + 1))
              fi
            fi

            if [[ "$helm_cluster" != "$prev_cluster" ]]; then
              display_cluster="$helm_cluster"
              prev_cluster="$helm_cluster"
            else
              display_cluster=""
            fi

            printf "%-35s %-30s %-20s %-20s\n" \
              "$display_cluster" "$helm_instance" "$helm_app" "$status"

          done < <(cat helmfile_data.txt)

          echo ""
          echo "=============================================================="
          echo ""
          echo "STATISTICS:"
          echo "  Total helmfile instances : $total"
          echo "  YES  (deployed)          : $count_yes"
          echo "  NO   (not deployed)      : $count_no"
          echo "  UNREACHABLE              : $count_unreachable"
          echo "  CLUSTER-NOT-FOUND        : $count_not_found"

          if [[ $total -gt 0 ]]; then
            checkable=$((count_yes + count_no))
            if [[ $checkable -gt 0 ]]; then
              percentage=$(echo "scale=1; $count_yes * 100 / $checkable" | bc)
              echo ""
              echo "  Coverage (reachable clusters only): ${percentage}%"
            fi
          fi
          echo ""

      # =========================
      # BUILD CONFLUENCE HTML TABLE
      # Generates an HTML table and saves it to confluence_table.html
      # This is then used by the next step to update the Confluence page
      # =========================
      - name: Build Confluence HTML Table
        run: |
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Colours for status badges
          color_yes="#36B37E"       # green
          color_no="#FF5630"        # red
          color_unreachable="#FFAB00"  # amber
          color_not_found="#6554C0"    # purple

          # Recalculate totals for the summary banner
          total=$(wc -l < helmfile_data.txt)
          count_yes=0; count_no=0; count_unreachable=0; count_not_found=0

          while IFS='|' read helm_cluster helm_ns helm_instance helm_app in_aks; do
            if [[ "$in_aks" == "N" ]]; then
              count_not_found=$((count_not_found + 1))
            elif grep -qxF "$helm_cluster" unreachable_clusters.txt 2>/dev/null; then
              count_unreachable=$((count_unreachable + 1))
            else
              if grep -qxF "$helm_cluster|$helm_ns" aks_namespaces.txt 2>/dev/null || \
                 grep -qxF "$helm_cluster|$helm_ns|$helm_instance" aks_data.txt 2>/dev/null; then
                count_yes=$((count_yes + 1))
              else
                count_no=$((count_no + 1))
              fi
            fi
          done < helmfile_data.txt

          checkable=$((count_yes + count_no))
          if [[ $checkable -gt 0 ]]; then
            coverage=$(echo "scale=1; $count_yes * 100 / $checkable" | bc)
          else
            coverage="N/A"
          fi

          cat > confluence_table.html << HTMLEOF
          <p><strong>Last updated:</strong> ${RUN_DATE} &nbsp;|&nbsp;
          <a href="${RUN_URL}">View pipeline run</a></p>

          <table>
            <colgroup>
              <col style="width: 30px;" />
              <col style="width: 30px;" />
              <col style="width: 30px;" />
              <col style="width: 30px;" />
            </colgroup>
            <tbody>
              <tr style="background-color:#F4F5F7;">
                <th><strong>Total</strong></th>
                <th><strong>Deployed ✅</strong></th>
                <th><strong>Not Deployed ❌</strong></th>
                <th><strong>Unreachable ⚠️</strong></th>
                <th><strong>Cluster Not Found 🔍</strong></th>
                <th><strong>Coverage</strong></th>
              </tr>
              <tr>
                <td>${total}</td>
                <td style="color:${color_yes};font-weight:bold;">${count_yes}</td>
                <td style="color:${color_no};font-weight:bold;">${count_no}</td>
                <td style="color:${color_unreachable};font-weight:bold;">${count_unreachable}</td>
                <td style="color:${color_not_found};font-weight:bold;">${count_not_found}</td>
                <td><strong>${coverage}%</strong></td>
              </tr>
            </tbody>
          </table>

          <br/>

          <table>
            <colgroup>
              <col style="width: 30px;" />
              <col style="width: 30px;" />
              <col style="width: 30px;" />
              <col style="width: 30px;" />
            </colgroup>
            <tbody>
              <tr style="background-color:#F4F5F7;">
                <th><strong>Cluster</strong></th>
                <th><strong>Instance</strong></th>
                <th><strong>App Type</strong></th>
                <th><strong>Status</strong></th>
              </tr>
          HTMLEOF

          prev_cluster=""
          while IFS='|' read helm_cluster helm_ns helm_instance helm_app in_aks; do
            status="NO"

            if [[ "$in_aks" == "N" ]]; then
              status="CLUSTER-NOT-FOUND"
            elif grep -qxF "$helm_cluster" unreachable_clusters.txt 2>/dev/null; then
              status="UNREACHABLE"
            else
              if grep -qxF "$helm_cluster|$helm_ns" aks_namespaces.txt 2>/dev/null || \
                 grep -qxF "$helm_cluster|$helm_ns|$helm_instance" aks_data.txt 2>/dev/null; then
                status="YES"
              fi
            fi

            # Status badge colour
            case "$status" in
              YES)               badge_color="$color_yes"   ;;
              NO)                badge_color="$color_no"    ;;
              UNREACHABLE)       badge_color="$color_unreachable" ;;
              CLUSTER-NOT-FOUND) badge_color="$color_not_found"  ;;
            esac

            # Show cluster name only on first row per cluster
            if [[ "$helm_cluster" != "$prev_cluster" ]]; then
              display_cluster="$helm_cluster"
              prev_cluster="$helm_cluster"
              row_bg="background-color:#FAFAFA;"
            else
              display_cluster=""
              row_bg=""
            fi

            cat >> confluence_table.html << ROWEOF
              <tr style="${row_bg}">
                <td><strong>${display_cluster}</strong></td>
                <td>${helm_instance}</td>
                <td>${helm_app}</td>
                <td><span style="color:${badge_color};font-weight:bold;">${status}</span></td>
              </tr>
          ROWEOF

          done < helmfile_data.txt

          echo "    </tbody>" >> confluence_table.html
          echo "  </table>" >> confluence_table.html

          echo "Confluence HTML table built: $(wc -l < confluence_table.html) lines"

      # =========================
      # UPDATE CONFLUENCE PAGE
      # Uses Confluence REST API v1 to update page content
      # Secrets required:
      #   CONFLUENCE_EMAIL     - your Atlassian account email
      #   CONFLUENCE_API_TOKEN - Atlassian API token
      # Page ID: 1286471859 (from URL)
      # =========================
      - name: Update Confluence Page
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          CONFLUENCE_BASE_URL="https://netreveal.atlassian.net"
          PAGE_ID="1286471859"

          echo "Fetching current page version..."

          # Get current page version (required for update)
          PAGE_META=$(curl -s \
            -u "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${CONFLUENCE_BASE_URL}/wiki/rest/api/content/${PAGE_ID}?expand=version,body.storage")

          CURRENT_VERSION=$(echo "$PAGE_META" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data['version']['number'])
          ")

          PAGE_TITLE=$(echo "$PAGE_META" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data['title'])
          ")

          echo "Current page: '${PAGE_TITLE}' at version ${CURRENT_VERSION}"
          NEW_VERSION=$((CURRENT_VERSION + 1))

          # Read generated HTML table
          TABLE_HTML=$(cat confluence_table.html)

          # Build the full page body — wraps the table in a clearly marked section
          # so future runs can replace just the automation block
          FULL_BODY="<h2>Cluster Deployment Status</h2>
          <ac:structured-macro ac:name=\"info\">
            <ac:rich-text-body>
              <p>This table is automatically generated by the
              <a href=\"${{ github.server_url }}/${{ github.repository }}/actions\">cluster-details pipeline</a>.
              Do not edit manually — changes will be overwritten on the next run.</p>
            </ac:rich-text-body>
          </ac:structured-macro>
          ${TABLE_HTML}"

          # Escape for JSON
          ESCAPED_BODY=$(echo "$FULL_BODY" | python3 -c "
          import sys, json
          print(json.dumps(sys.stdin.read()))
          ")

          # Build JSON payload
          PAYLOAD=$(python3 -c "
          import json
          body = ${ESCAPED_BODY}
          payload = {
            'version': {'number': ${NEW_VERSION}},
            'title': '${PAGE_TITLE}',
            'type': 'page',
            'body': {
              'storage': {
                'value': body,
                'representation': 'storage'
              }
            }
          }
          print(json.dumps(payload))
          ")

          echo "Updating Confluence page to version ${NEW_VERSION}..."

          HTTP_STATUS=$(curl -s -o /tmp/confluence_response.json -w "%{http_code}" \
            -X PUT \
            -u "${CONFLUENCE_EMAIL}:${CONFLUENCE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "${PAYLOAD}" \
            "${CONFLUENCE_BASE_URL}/wiki/rest/api/content/${PAGE_ID}")

          if [[ "$HTTP_STATUS" == "200" ]]; then
            echo "✅ Confluence page updated successfully (HTTP ${HTTP_STATUS})"
            echo "   Page: ${CONFLUENCE_BASE_URL}/wiki/spaces/CDOPSNROD/pages/${PAGE_ID}"
          else
            echo "❌ Confluence update failed (HTTP ${HTTP_STATUS})"
            echo "Response:"
            cat /tmp/confluence_response.json
            exit 1
          fi

      # =========================
      # UPLOAD ARTIFACTS
      # =========================
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-reports
          path: |
            aks_clusters.txt
            helmfile_data.txt
            aks_data.txt
            aks_namespaces.txt
            unreachable_clusters.txt
            confluence_table.html
          retention-days: 7
